          containerRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({
            root: containerRef.current
          });
        }
      }, [name, className]);

      return <span ref={containerRef} className="inline-flex items-center justify-center shrink-0" {...props}></span>;

    const PARTNERS = ['Sarwar', 'Wazham'];

    const DEFAULT_CATEGORIES = {
      income: [
        'Delivery Settlement',
        'Merchant Commission',
        'Direct Sales Revenue',
        'Storage & Warehousing',
        'Client Fee Recovery', 'Partner Loan Repayment', 'Other Revenue'
      ],
      expense: [
        'Logistics & Fuel',
        'Courier & Driver Payroll',
        'Warehouse & Office Rent',
        'Marketing & Paid Ads',
        'Software & Telephony',

        'General Operations',
        'Partner Drawing'
      ],
      transfer: ['Internal Account Rebalance', 'Cash to Bank Deposit', 'Bank to Card Top-up'],
      withdrawal: ['Partner Drawing', 'Partner Loan / Advance', 'Dividend Payout', 'Personal Expense Reimbursement']
    };

    const TRANSACTION_CATEGORIES = DEFAULT_CATEGORIES;

    
    
    // ==========================================
    // REST API CLIENT (CONNECTS TO NODE.JS & SQLITE)
    // ==========================================
    const isNodeBackend = window.location.protocol.startsWith('http');
    
    const api = {
      getToken: () => localStorage.getItem('ordercenter_token'),
      setToken: (t) => localStorage.setItem('ordercenter_token', t),
      clearToken: () => localStorage.removeItem('ordercenter_token'),
      
      headers: () => ({
        'Content-Type': 'application/json',
        ...(localStorage.getItem('ordercenter_token') ? { 'Authorization': `Bearer ${localStorage.getItem('ordercenter_token')}` } : {})
      }),

      async login(username, password) {
        if (!isNodeBackend) {
          // Fallback if opened directly via file://
          const savedUsers = JSON.parse(localStorage.getItem('ordercenter_users') || '[]');
          const user = savedUsers.find(u => u.username.toLowerCase() === username.trim().toLowerCase());
          if (!user) throw new Error('Account not found.');
          if (!user.active) throw new Error('Account is suspended.');
          const passwords = JSON.parse(localStorage.getItem('ordercenter_passwords') || '{}');
          if (password !== (passwords[user.username] || 'admin123')) throw new Error('Incorrect password.');
          return { token: 'mock_token', user };
        }
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        this.setToken(data.token);
        return data;
      },

      async getMe() {
        if (!isNodeBackend) return JSON.parse(localStorage.getItem('ordercenter_session') || 'null');
        const token = this.getToken();
        if (!token) return null;
        try {
          const res = await fetch('/api/auth/me', { headers: this.headers() });
          if (!res.ok) { this.clearToken(); return null; }
          const data = await res.json();
          return data.user;
        } catch (e) {
          return null;
        }
      },

      async logout() {
        if (isNodeBackend) {
          await fetch('/api/auth/logout', { method: 'POST', headers: this.headers() }).catch(() => {});
        }
        this.clearToken();
      },

      async getTransactions() {
        if (!isNodeBackend) return JSON.parse(localStorage.getItem('ordercenter_erp_v1_txs') || '[]');
        const res = await fetch('/api/transactions', { headers: this.headers() });
        const data = await res.json();
        return data.transactions || [];
      },

      async createTransaction(tx) {
        if (!isNodeBackend) {
          const txs = JSON.parse(localStorage.getItem('ordercenter_erp_v1_txs') || '[]');
          const newTx = { ...tx, id: 'tx_' + Date.now(), createdAt: new Date().toISOString() };
          localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify([newTx, ...txs]));
          return newTx;
        }
        const res = await fetch('/api/transactions', {
          method: 'POST',
          headers: this.headers(),
          body: JSON.stringify(tx)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to create transaction');
        return data.transaction;
      },

      async updateTransaction(id, tx) {
        if (!isNodeBackend) {
          const txs = JSON.parse(localStorage.getItem('ordercenter_erp_v1_txs') || '[]');
          const updated = txs.map(t => t.id === id ? { ...t, ...tx } : t);
          localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify(updated));
          return tx;
        }
        const res = await fetch(`/api/transactions/${id}`, {
          method: 'PUT',
          headers: this.headers(),
          body: JSON.stringify(tx)
        });
        const data = await res.json();
        return data.transaction;
      },

      async deleteTransaction(id) {
        if (!isNodeBackend) {
          const txs = JSON.parse(localStorage.getItem('ordercenter_erp_v1_txs') || '[]');
          localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify(txs.filter(t => t.id !== id)));
          return true;
        }
        await fetch(`/api/transactions/${id}`, { method: 'DELETE', headers: this.headers() });
        return true;
      },

      async clearAllTransactions() {
        if (!isNodeBackend) {
          localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify([]));
          return true;
        }
        await fetch('/api/transactions/clear-all', { method: 'POST', headers: this.headers() });
        return true;
      },

      async getBalances() {
        if (!isNodeBackend) return JSON.parse(localStorage.getItem('ordercenter_opening_balances') || '{"fib":0,"cihan":0,"qi":0,"hyperpost":0,"cash":0}');
        const res = await fetch('/api/balances', { headers: this.headers() });
        const data = await res.json();
        return data.balances;
      },

      async setBalances(balances) {
        if (!isNodeBackend) {
          localStorage.setItem('ordercenter_opening_balances', JSON.stringify(balances));
          return balances;
        }
        const res = await fetch('/api/balances', {
          method: 'PUT',
          headers: this.headers(),
          body: JSON.stringify(balances)
        });
        const data = await res.json();
        return data.balances;
      },

      async getLoans() {
        if (!isNodeBackend) return JSON.parse(localStorage.getItem('ordercenter_loans_v1') || '[]');
        try {
          const res = await fetch('/api/loans', { headers: this.headers() });
          if (!res.ok) return JSON.parse(localStorage.getItem('ordercenter_loans_v1') || '[]');
          const data = await res.json();
          return data.loans || [];
        } catch (e) {
          return JSON.parse(localStorage.getItem('ordercenter_loans_v1') || '[]');
        }
      },

      async createLoan(loan) {
        if (!isNodeBackend) {
          const loans = JSON.parse(localStorage.getItem('ordercenter_loans_v1') || '[]');
          const newLoan = { ...loan, id: loan.id || 'LN_' + Date.now() };
          localStorage.setItem('ordercenter_loans_v1', JSON.stringify([newLoan, ...loans]));
          return newLoan;
        }
        const res = await fetch('/api/loans', {
          method: 'POST',
          headers: this.headers(),
          body: JSON.stringify(loan)
        });
        const data = await res.json();
        return data.loan;
      },

      async updateLoan(id, updates) {
        if (!isNodeBackend) {
          const loans = JSON.parse(localStorage.getItem('ordercenter_loans_v1') || '[]');
          const updated = loans.map(l => l.id === id ? { ...l, ...updates } : l);
          localStorage.setItem('ordercenter_loans_v1', JSON.stringify(updated));
          return updates;
        }
        const res = await fetch(`/api/loans/${id}`, {
          method: 'PUT',
          headers: this.headers(),
          body: JSON.stringify(updates)
        });
        const data = await res.json();
        return data.loan;
      },

      async deleteLoan(id) {
        if (!isNodeBackend) {
          const loans = JSON.parse(localStorage.getItem('ordercenter_loans_v1') || '[]');
          localStorage.setItem('ordercenter_loans_v1', JSON.stringify(loans.filter(l => l.id !== id)));
          return true;
        }
        await fetch(`/api/loans/${id}`, { method: 'DELETE', headers: this.headers() });
        return true;
      },

      async clearAllLoans() {
        if (!isNodeBackend) {
          localStorage.setItem('ordercenter_loans_v1', JSON.stringify([]));
          localStorage.setItem('ordercenter_loan_repayments_v1', JSON.stringify([]));
          return true;
        }
        await fetch('/api/loans/clear-all', { method: 'POST', headers: this.headers() });
        return true;
      },

      async getLoanRepayments() {
        if (!isNodeBackend) return JSON.parse(localStorage.getItem('ordercenter_loan_repayments_v1') || '[]');
        try {
          const res = await fetch('/api/loan-repayments', { headers: this.headers() });
          if (!res.ok) return JSON.parse(localStorage.getItem('ordercenter_loan_repayments_v1') || '[]');
          const data = await res.json();
          return data.repayments || [];
        } catch (e) {
          return JSON.parse(localStorage.getItem('ordercenter_loan_repayments_v1') || '[]');
        }
      },

      async createLoanRepayment(repayment) {
        if (!isNodeBackend) {
          const repayments = JSON.parse(localStorage.getItem('ordercenter_loan_repayments_v1') || '[]');
          const newRep = { ...repayment, id: repayment.id || 'REP_' + Date.now() };
          localStorage.setItem('ordercenter_loan_repayments_v1', JSON.stringify([newRep, ...repayments]));
          return newRep;
        }
        const res = await fetch('/api/loan-repayments', {
          method: 'POST',
          headers: this.headers(),
          body: JSON.stringify(repayment)
        });
        const data = await res.json();
        return data.repayment;
      },

      async deleteLoanRepayment(id) {
        if (!isNodeBackend) {
          const repayments = JSON.parse(localStorage.getItem('ordercenter_loan_repayments_v1') || '[]');
          localStorage.setItem('ordercenter_loan_repayments_v1', JSON.stringify(repayments.filter(r => r.id !== id)));
          return true;
        }
        await fetch(`/api/loan-repayments/${id}`, { method: 'DELETE', headers: this.headers() });
        return true;
      },

      async getUsers() {
        if (!isNodeBackend) return JSON.parse(localStorage.getItem('ordercenter_users') || '[]');
        const res = await fetch('/api/users', { headers: this.headers() });
        if (!res.ok) return [];
        const data = await res.json();
        return data.users || [];
      },

      async createUser(userData) {
        if (!isNodeBackend) {
          const users = JSON.parse(localStorage.getItem('ordercenter_users') || '[]');
          const newUser = { id: 'usr_' + Date.now(), ...userData, role: userData.role || 'user', active: 1, createdAt: new Date().toISOString().split('T')[0] };
          users.push(newUser);
          localStorage.setItem('ordercenter_users', JSON.stringify(users));
          return newUser;
        }
        const res = await fetch('/api/users', {
          method: 'POST',
          headers: this.headers(),
          body: JSON.stringify(userData)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to create user');
        return data.user;
      },

      async toggleUserStatus(id, active) {
        if (!isNodeBackend) {
          const users = JSON.parse(localStorage.getItem('ordercenter_users') || '[]');
          const updated = users.map(u => u.id === id ? { ...u, active: active ? 1 : 0 } : u);
          localStorage.setItem('ordercenter_users', JSON.stringify(updated));
          return true;
        }
        await fetch(`/api/users/${id}/status`, {
          method: 'PATCH',
          headers: this.headers(),
          body: JSON.stringify({ active })
        });
        return true;
      },

      async resetPassword(userId, newPassword) {
        if (!isNodeBackend) return true;
        const res = await fetch(`/api/users/${userId}/password`, {
          method: 'PUT',
          headers: this.headers(),
          body: JSON.stringify({ newPassword })
        });
        if (!res.ok) {
          const d = await res.json();
          throw new Error(d.error || 'Failed to reset password');
        }
        return true;
      },

      async deleteUser(id) {
        if (!isNodeBackend) {
          const users = JSON.parse(localStorage.getItem('ordercenter_users') || '[]');
          localStorage.setItem('ordercenter_users', JSON.stringify(users.filter(u => u.id !== id)));
          return true;
        }
        await fetch(`/api/users/${id}`, { method: 'DELETE', headers: this.headers() });
        return true;
      },

      async getBackup() {
        if (!isNodeBackend) {
          return {
            version: '2.5.0',
            system: 'Order Center ERP',
            exportedAt: new Date().toISOString(),
            transactions: JSON.parse(localStorage.getItem('ordercenter_erp_v1_txs') || '[]'),
            openingBalances: JSON.parse(localStorage.getItem('ordercenter_opening_balances') || '{"fib":0,"cihan":0,"qi":0,"hyperpost":0,"cash":0}'),

            users: JSON.parse(localStorage.getItem('ordercenter_users') || '[]'),
            categories: JSON.parse(localStorage.getItem('ordercenter_categories_v1') || 'null'),
            exchangeRate: Number(localStorage.getItem('ordercenter_usd_rate')) || 1500
          };
        }
        const res = await fetch('/api/backup', { headers: this.headers() });
        if (!res.ok) {
          const d = await res.json();
          throw new Error(d.error || 'Failed to fetch backup');
        }
        const data = await res.json();
        return data.backup;
      },

      async restoreBackup(backupData) {
        if (!isNodeBackend) {
          if (backupData.transactions) localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify(backupData.transactions));
          if (backupData.openingBalances) localStorage.setItem('ordercenter_opening_balances', JSON.stringify(backupData.openingBalances));
          if (backupData.loans) localStorage.setItem('ordercenter_loans_v1', JSON.stringify(backupData.loans));
          if (backupData.users) localStorage.setItem('ordercenter_users', JSON.stringify(backupData.users));
          if (backupData.categories) localStorage.setItem('ordercenter_categories_v1', JSON.stringify(backupData.categories));
          if (backupData.exchangeRate) localStorage.setItem('ordercenter_usd_rate', backupData.exchangeRate.toString());
          return true;
        }
        const res = await fetch('/api/restore', {
          method: 'POST',
          headers: this.headers(),
          body: JSON.stringify(backupData)
        });
        if (!res.ok) {
          const d = await res.json();
          throw new Error(d.error || 'Failed to restore backup');
        }
        return true;
      }
    };

              api.getLoanRepayments ? api.getLoanRepayments() : Promise.resolve([])
            ]);
            if (serverTxs && Array.isArray(serverTxs)) {
              const sanitized = serverTxs.map(tx => {
                const rate = Number(tx.exchangeRate) || 1500;
                const amtIQD = tx.amountIQD !== undefined && tx.amountIQD !== null
                  ? Number(tx.amountIQD)
                  : (tx.currency === 'USD' ? (Number(tx.amount) * rate) : Number(tx.amount));
                return { ...tx, exchangeRate: rate, amountIQD: amtIQD };
              });
              setTransactions(sanitized);
              localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify(sanitized));
            }
            if (serverBalances) {
              setOpeningBalances(serverBalances);
              localStorage.setItem('ordercenter_opening_balances', JSON.stringify(serverBalances));
            }
            if (serverLoans && Array.isArray(serverLoans)) {

        setRepayingLoan(loan);
        setRepayForm({
          amount: defaultAmt !== null ? defaultAmt.toString() : loan.remainingAmount.toString(),
          accountId: loan.accountId || 'fib',
          notes: '',
          date: new Date().toISOString().slice(0, 16)
        });
      };

      // Save transactions to localStorage
      useEffect(() => {
        localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify(transactions));
      }, [transactions]);

      // Save opening balances to localStorage
      useEffect(() => {
        localStorage.setItem('ordercenter_opening_balances', JSON.stringify(openingBalances));
        setOpeningForm(openingBalances);
      }, [openingBalances]);

      // Save USD rate to localStorage
      useEffect(() => {
        localStorage.setItem('ordercenter_usd_rate', exchangeRate.toString());
      }, [exchangeRate]);

      // Toast Notification
      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      // Currency Helpers
      // Currency Helpers (Strict historical locking: past records & loans NEVER recalculate or shift when global rate changes)
      const toIQD = (amountOrItem, currency, itemExchangeRate = null) => {
        if (typeof amountOrItem === 'object' && amountOrItem !== null) {
          const item = amountOrItem;
          const curr = item.currency || currency || 'IQD';
          const val = Number(item.amount !== undefined ? item.amount : (item.remainingAmount !== undefined ? item.remainingAmount : 0)) || 0;
          if (curr !== 'USD') {
            return val;
          }
          if (item.amountIQD !== undefined && item.amountIQD !== null) {
            return Number(item.amountIQD) || 0;
          }
          const lockedRate = Number(item.exchangeRate) || Number(itemExchangeRate) || 1500;
          return val * lockedRate;
        }

        const val = Number(amountOrItem) || 0;
        if (currency === 'USD') {
          const rate = Number(itemExchangeRate) || 1500;
          return val * rate;
        }
        return val;
      };

      const formatIQD = (val) => {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'IQD',
          maximumFractionDigits: 0
        }).format(val || 0).replace('IQD', lang === 'ku' ? 'د.ع' : 'IQD');
      };

      const formatUSD = (valIQD, customRate = null) => {
        const rate = Number(customRate) || exchangeRate || 1500;
        const usd = (Number(valIQD) || 0) / rate;
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          maximumFractionDigits: 2
        }).format(usd);
      };

      // Calculate Net Balances for all 5 accounts (Opening Balance + Transactions)
      const accountBalances = useMemo(() => {
        const balances = { 
          fib: Number(openingBalances.fib) || 0, 
          cihan: Number(openingBalances.cihan) || 0, 
          qi: Number(openingBalances.qi) || 0, 
          hyperpost: Number(openingBalances.hyperpost) || 0, 
          cash: Number(openingBalances.cash) || 0 
        };

        transactions.forEach((tx) => {
          const amtIQD = toIQD(tx);
          if (tx.type === 'income') {
            balances[tx.accountId] = (balances[tx.accountId] || 0) + amtIQD;
          } else if (tx.type === 'expense' || tx.type === 'withdrawal') {
            balances[tx.accountId] = (balances[tx.accountId] || 0) - amtIQD;
          } else if (tx.type === 'transfer') {
            balances[tx.accountId] = (balances[tx.accountId] || 0) - amtIQD;
            if (tx.toAccountId) {
              balances[tx.toAccountId] = (balances[tx.toAccountId] || 0) + amtIQD;
            }
          }
        });
        return balances;
      }, [transactions, openingBalances]);

      // Total Liquidity
      const totalConsolidatedLiquidity = useMemo(() => {
        return Object.values(accountBalances).reduce((acc, curr) => acc + curr, 0);
      }, [accountBalances]);

      // Helper function to resolve partner key (supports Sarwar/سەروەر and Wazham/واژام)
      const getPartnerKey = (p) => {
        if (!p) return null;
        const s = p.toString().trim().toLowerCase();
        if (s === 'sarwar' || s === 'سەروەر') return 'Sarwar';
        if (s === 'wazham' || s === 'واژام') return 'Wazham';
        return null;
      };

      // Metrics & Analytics
      const metrics = useMemo(() => {
        let totalRevenue = 0;
        let totalExpenses = 0;
        let partnerIncomes = { Sarwar: 0, Wazham: 0 };
        let partnerWithdrawals = { Sarwar: 0, Wazham: 0 };
        let partnerLoans = { Sarwar: 0, Wazham: 0 };
        let companyGeneralIncome = 0;

        transactions.forEach((tx) => {
          const amtIQD = toIQD(tx);
          const cat = (tx.category || '').toLowerCase();
          const isLoan = cat.includes('loan') || cat.includes('advance') || cat.includes('قەرز') || cat.includes('fee recovery');
          const isDrawing = tx.type === 'withdrawal' || cat.includes('drawing') || cat.includes('ڕاکێشان');
          const pKey = getPartnerKey(tx.partner);

          if (isDrawing || tx.type === 'withdrawal') {
            if (isLoan) {
              if (pKey) {
                partnerLoans[pKey] += amtIQD;
              }
            } else {
              if (pKey) {
                partnerWithdrawals[pKey] += amtIQD;
              }
            }
          } else if (tx.type === 'income') {
            if (isLoan) {
              if (pKey) {
                partnerLoans[pKey] = Math.max(0, partnerLoans[pKey] - amtIQD);
              }
            } else {
              // "in Income it will be only that money the person bring it"
              if (pKey === 'Sarwar') {
                partnerIncomes.Sarwar += amtIQD;
              } else if (pKey === 'Wazham') {
                partnerIncomes.Wazham += amtIQD;
              } else {
                companyGeneralIncome += amtIQD;
              }
              totalRevenue += amtIQD;
            }
          } else if (tx.type === 'expense') {
            // "also for expense the money will be decreased from the total not from income for the people"
            if (!isLoan && !isDrawing) {
              totalExpenses += amtIQD;
            }
          }
        });

        const partnerLoansGiven = { Sarwar: 0, Wazham: 0 };
        const partnerLoansBorrowed = { Sarwar: 0, Wazham: 0 };

        loans.forEach(l => {
          if (l.status === 'active') {
            const pKey = getPartnerKey(l.personName) || (getPartnerKey(l.partner) && (!l.personName || l.personName === l.partner));
            if (pKey) {
              const rem = toIQD({ ...l, amount: l.remainingAmount });
              if (l.direction === 'given') {
                partnerLoansGiven[pKey] += rem;
              } else if (l.direction === 'borrowed') {
                partnerLoansBorrowed[pKey] += rem;
              }
            }
          }
        });

        const effectivePartnerLoans = {
          Sarwar: loans.length > 0 ? partnerLoansGiven.Sarwar : partnerLoans.Sarwar,
          Wazham: loans.length > 0 ? partnerLoansGiven.Wazham : partnerLoans.Wazham
        };

        const netProfit = totalRevenue - totalExpenses;
        const totalDrawings = partnerWithdrawals.Sarwar + partnerWithdrawals.Wazham;
        const totalLoans = effectivePartnerLoans.Sarwar + effectivePartnerLoans.Wazham;
        const netRetained = netProfit - totalDrawings - totalLoans;

        return {
          totalRevenue,
          totalExpenses,
          companyGeneralIncome,
          partnerIncomes,
          netProfit,
          netRetained,
          partnerWithdrawals,
          partnerLoans: effectivePartnerLoans,
          partnerLoansGiven,
          partnerLoansBorrowed
        };
      }, [transactions, loans]);

      // Filtered Transactions
      const filteredTransactions = useMemo(() => {
        return transactions.filter((tx) => {
          const searchMatch = 
            (tx.notes || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (tx.category || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (tx.refNumber && tx.refNumber.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (tx.amount || '').toString().includes(searchQuery);

          const accountMatch = 
            selectedAccountFilter === 'all' || 
            tx.accountId === selectedAccountFilter || 
            tx.toAccountId === selectedAccountFilter;

          const partnerMatch = 
            selectedPartnerFilter === 'all' || 
            getPartnerKey(tx.partner) === selectedPartnerFilter || 
            tx.partner === selectedPartnerFilter;

          const typeMatch = 
            selectedTypeFilter === 'all' || 
            tx.type === selectedTypeFilter;

          let dateMatch = true;
          if (dateFilter !== 'all') {
            const txDate = new Date(tx.date);
            const now = new Date();
            if (dateFilter === 'today') {
              dateMatch = txDate.toDateString() === now.toDateString();
            } else if (dateFilter.startsWith('month-')) {
              const targetMonth = parseInt(dateFilter.split('-')[1], 10);
              dateMatch = txDate.getMonth() === targetMonth;
            } else if (dateFilter === 'week') {
              const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
              dateMatch = txDate >= weekAgo;
            } else if (dateFilter === 'month') {
              dateMatch = txDate.getMonth() === now.getMonth() && txDate.getFullYear() === now.getFullYear();
            }
          }

          return searchMatch && accountMatch && partnerMatch && typeMatch && dateMatch;
        }).sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [transactions, searchQuery, selectedAccountFilter, selectedPartnerFilter, selectedTypeFilter, dateFilter]);

      // Reset transaction page to 1 on filter or search changes
      useEffect(() => {
        setTxCurrentPage(1);
      }, [searchQuery, selectedAccountFilter, selectedPartnerFilter, selectedTypeFilter, dateFilter]);

      const totalTxPages = Math.max(1, Math.ceil(filteredTransactions.length / TXS_PER_PAGE));

      useEffect(() => {
        if (txCurrentPage > totalTxPages) {
          setTxCurrentPage(totalTxPages);
        }
      }, [totalTxPages, txCurrentPage]);

      const paginatedTransactions = useMemo(() => {
        const startIdx = (txCurrentPage - 1) * TXS_PER_PAGE;
        return filteredTransactions.slice(startIdx, startIdx + TXS_PER_PAGE);
      }, [filteredTransactions, txCurrentPage]);

      const txStartIndex = filteredTransactions.length === 0 ? 0 : (txCurrentPage - 1) * TXS_PER_PAGE + 1;
      const txEndIndex = Math.min(txCurrentPage * TXS_PER_PAGE, filteredTransactions.length);

      const getTxPageNumbers = () => {
        if (totalTxPages <= 7) {
          return Array.from({ length: totalTxPages }, (_, i) => i + 1);
        }
        const pages = [];
        if (txCurrentPage <= 4) {
          for (let i = 1; i <= 5; i++) pages.push(i);
          pages.push('...');
          pages.push(totalTxPages);
        } else if (txCurrentPage >= totalTxPages - 3) {
          pages.push(1);
          pages.push('...');
          for (let i = totalTxPages - 4; i <= totalTxPages; i++) pages.push(i);
        } else {
          pages.push(1);
          pages.push('...');
          for (let i = txCurrentPage - 1; i <= txCurrentPage + 1; i++) pages.push(i);
          pages.push('...');
          pages.push(totalTxPages);
        }
        return pages;
      };

      // Dashboard Recent Transactions Pagination
      const sortedRecentTransactions = useMemo(() => {
        return [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [transactions]);

      const totalRecentTxPages = Math.max(1, Math.ceil(sortedRecentTransactions.length / RECENT_TXS_PER_PAGE));

      useEffect(() => {
        if (recentTxCurrentPage > totalRecentTxPages) {
          setRecentTxCurrentPage(totalRecentTxPages);
        }
      }, [totalRecentTxPages, recentTxCurrentPage]);

      const paginatedRecentTransactions = useMemo(() => {
        const startIdx = (recentTxCurrentPage - 1) * RECENT_TXS_PER_PAGE;
        return sortedRecentTransactions.slice(startIdx, startIdx + RECENT_TXS_PER_PAGE);
      }, [sortedRecentTransactions, recentTxCurrentPage]);

      const recentTxStartIndex = sortedRecentTransactions.length === 0 ? 0 : (recentTxCurrentPage - 1) * RECENT_TXS_PER_PAGE + 1;
      const recentTxEndIndex = Math.min(recentTxCurrentPage * RECENT_TXS_PER_PAGE, sortedRecentTransactions.length);

      const getRecentTxPageNumbers = () => {
        if (totalRecentTxPages <= 7) {
          return Array.from({ length: totalRecentTxPages }, (_, i) => i + 1);
        }
        const pages = [];
        if (recentTxCurrentPage <= 4) {
          for (let i = 1; i <= 5; i++) pages.push(i);
          pages.push('...');
          pages.push(totalRecentTxPages);
        } else if (recentTxCurrentPage >= totalRecentTxPages - 3) {
          pages.push(1);
          pages.push('...');
          for (let i = totalRecentTxPages - 4; i <= totalRecentTxPages; i++) pages.push(i);
        } else {
          pages.push(1);
          pages.push('...');
          for (let i = recentTxCurrentPage - 1; i <= recentTxCurrentPage + 1; i++) pages.push(i);
          pages.push('...');
          pages.push(totalRecentTxPages);
        }
        return pages;
      };

      // Category breakdown
      const categoryBreakdown = useMemo(() => {
        const incomeCats = {};
        const expenseCats = {};
        transactions.forEach((tx) => {
          const amt = toIQD(tx);
          if (tx.type === 'income') {
            incomeCats[tx.category] = (incomeCats[tx.category] || 0) + amt;
          } else if (tx.type === 'expense') {
            expenseCats[tx.category] = (expenseCats[tx.category] || 0) + amt;
          }
        });
        return { incomeCats, expenseCats };
      }, [transactions]);

      // Action Handlers
      const handleSaveTransaction = async (e) => {
        e.preventDefault();
        if (!txForm.amount || Number(txForm.amount) <= 0) return;

        if (txForm.type === 'withdrawal' && !txForm.partner) {
          triggerToast(lang === 'ku' ? 'تکایە هاوبەش دیاریبکە بۆ ڕاکێشانی هاوبەش' : 'Please select a partner for the drawing');
          return;
        }

        const autoRef = txForm.refNumber || generateNextInvoiceNumber(transactions);
        const lockedRate = txForm.useDefaultRate
          ? (editingTx?.exchangeRate || exchangeRate)
          : (Number(txForm.customRate) || exchangeRate);
        const newTx = {
          id: editingTx ? editingTx.id : `TX-${Date.now().toString().slice(-5)}`,
          refNumber: autoRef,
          type: txForm.type,
          amount: Number(txForm.amount),
          currency: txForm.currency,
          exchangeRate: lockedRate,
          amountIQD: txForm.currency === 'USD' ? Number(txForm.amount) * lockedRate : Number(txForm.amount),
          accountId: txForm.accountId,
          toAccountId: txForm.type === 'transfer' ? txForm.toAccountId : null,
          partner: txForm.partner || null,
          category: txForm.category,
          notes: txForm.notes.trim() || (lang === 'ku' ? 'هیچ تێبینییەک نەنووسراوە' : 'No memo provided.'),
          date: txForm.date
        };

        if (editingTx) {
          setTransactions((prev) => prev.map((t) => (t.id === editingTx.id ? newTx : t)));
          if (typeof api !== 'undefined' && api.updateTransaction) {
            try {
              await api.updateTransaction(editingTx.id, newTx);
            } catch (err) {
              console.warn('[API] Could not update transaction on server:', err);
            }
          }
          triggerToast(lang === 'ku' ? 'تۆمارەکە نوێکرایەوە' : 'Transaction updated!');
        } else {
          setTransactions((prev) => [newTx, ...prev]);
          if (typeof api !== 'undefined' && api.createTransaction) {
            try {
              await api.createTransaction(newTx);
            } catch (err) {
              console.warn('[API] Could not save transaction to server:', err);
            }
          }
          triggerToast(
            txForm.type === 'withdrawal'
              ? (lang === 'ku' ? `ڕاکێشانی دارایی بۆ ${getPartnerName(newTx.partner)} تۆمارکرا` : `Drawing for ${newTx.partner} recorded!`)
              : (lang === 'ku' ? 'جووڵەی دارایی نوێ تۆمارکرا' : 'Transaction logged!')
          );
        }
        closeTxModal();
      };

      const handleSaveTransfer = async (e) => {
        e.preventDefault();
        if (!transferForm.amount || Number(transferForm.amount) <= 0) return;
        if (transferForm.fromAccountId === transferForm.toAccountId) {
          triggerToast(lang === 'ku' ? 'هەژماری سەرچاوە و مەبەست دەبێت جیاواز بن' : 'Accounts must be different.');
          return;
        }

        const transferRate = transferForm.currency === 'USD'
          ? (transferForm.useDefaultRate ? exchangeRate : (Number(transferForm.customRate) || exchangeRate))
          : exchangeRate;

        const newTx = {
          id: `TX-${Date.now().toString().slice(-5)}`,
          refNumber: `TR-${Math.floor(1000 + Math.random() * 9000)}`,
          type: 'transfer',
          amount: Number(transferForm.amount),
          currency: transferForm.currency,
          exchangeRate: transferRate,
          amountIQD: transferForm.currency === 'USD' ? Number(transferForm.amount) * transferRate : Number(transferForm.amount),
          accountId: transferForm.fromAccountId,
          toAccountId: transferForm.toAccountId,
          partner: transferForm.partner,
          category: 'Internal Account Rebalance',
          notes: transferForm.notes.trim() || (lang === 'ku' ? 'گواستنەوەی نێوان هەژمارەکان' : 'Internal liquidity transfer.'),
          date: transferForm.date
        };

        setTransactions((prev) => [newTx, ...prev]);
        if (typeof api !== 'undefined' && api.createTransaction) {
          try {
            await api.createTransaction(newTx);
          } catch (err) {
            console.warn('[API] Could not save transfer to server:', err);
          }
        }
        setIsTransferModalOpen(false);
        triggerToast(lang === 'ku' 
          ? `پارە گوازرایەوە لە ${ACCOUNTS[newTx.accountId].shortNameKu} بۆ ${ACCOUNTS[newTx.toAccountId].shortNameKu}` 
          : `Transferred from ${ACCOUNTS[newTx.accountId].shortName} to ${ACCOUNTS[newTx.toAccountId].shortName}!`);
      };

      const openNewTxModal = (type = 'income', partner = '', category = null) => {
        setEditingTx(null);
        setCategoryManagerType(type);
        const autoInvoice = generateNextInvoiceNumber(transactions);
        setTxForm({
          type,
          amount: '',
          currency: 'IQD',
          accountId: 'fib',
          toAccountId: 'cash',
          partner: partner || '',
          category: category || ((categories[type] && categories[type][0]) || 'General'),
          refNumber: autoInvoice,
          notes: '',
          date: new Date().toISOString().slice(0, 16),
          useDefaultRate: true,
          customRate: ''
        });
        setIsTxModalOpen(true);
      };

      const openEditTxModal = (tx) => {
        if (!isAdmin) return;
        setEditingTx(tx);
        setCategoryManagerType(tx.type);
        setTxForm({
          type: tx.type,
          amount: tx.amount,
          currency: tx.currency || 'IQD',
          accountId: tx.accountId,
          toAccountId: tx.toAccountId || 'cash',
          partner: tx.partner,
          category: tx.category,
          refNumber: tx.refNumber || tx.id || generateNextInvoiceNumber(transactions),
          notes: tx.notes,
          date: tx.date,
          useDefaultRate: true,
          customRate: ''
        });
        setIsTxModalOpen(true);
      };

      const closeTxModal = () => {
        setIsTxModalOpen(false);
        setEditingTx(null);
      };

      // Loan Action Handlers
      const handleSaveLoan = async (e) => {
        e.preventDefault();
        const amt = Number(loanForm.amount);
        if (!amt || amt <= 0) return;
        const person = (loanForm.personName || loanForm.partner || 'Sarwar').trim();
        if (!person) {
          triggerToast(lang === 'ku' ? 'تکایە ناوی لایەنی قەرز دیاریبکە' : 'Please specify loan party');
          return;
        }

        // Duplicate name check: only for external persons
        if (isDuplicateLoanName && !allowAdditionalLoan) {
          triggerToast(
            lang === 'ku'
              ? `کەسێکی تر هەیە بەم ناوەوە (${person})! ئەگەر دەتەوێت قەرزی زیاتر وەربگریت، کلیک لە 'قەرزی زیاتر' بکە.`
              : `There is another one with that name (${person})! Click 'Borrow more' to add an additional loan.`
          );
          return;
        }

        // Verify available card/cash balance in company account ONLY WHEN company gives loan
        const lockedRate = loanForm.currency === 'USD'
          ? (loanForm.useDefaultRate ? (editingLoan?.exchangeRate || exchangeRate) : (Number(loanForm.customRate) || exchangeRate))
          : (editingLoan?.exchangeRate || exchangeRate);
        const reqIQD = loanForm.currency === 'USD' ? amt * lockedRate : amt;
        const availableBalance = accountBalances[loanForm.accountId] || 0;
        if (loanForm.direction === 'given' && reqIQD > availableBalance) {
          triggerToast(
            lang === 'ku'
              ? `پارەی پێویست لەم کاردەدا یان کاش نییە! (کۆمپانیا ناتوانێت ئەم قەرزە بدات بە ${getPartnerName(loanForm.partner)}. بەردەست: ${formatIQD(availableBalance)}، داواکراو: ${formatIQD(reqIQD)}).`
              : `Not enough money in ${ACCOUNTS[loanForm.accountId]?.name || 'card/cash'}! Company cannot give this loan to ${getPartnerName(loanForm.partner)} (Available: ${formatIQD(availableBalance)}, Requested: ${formatIQD(reqIQD)}).`
          );
          return;
        }

        const isBorrowed = loanForm.direction === 'borrowed';
        const txType = isBorrowed ? 'income' : 'withdrawal';
        const txCategory = isBorrowed ? 'Company Loan (Taken)' : 'Company Loan (Given)';
        const isPartnerDirect = person === 'Sarwar' || person === 'Wazham';

        const defaultMemo = isBorrowed
          ? (lang === 'ku'
              ? (isPartnerDirect ? `کۆمپانیا قەرزی لە ${getPartnerName(person)} وەرگرت` : `کۆمپانیا قەرزی لە (${person}) وەرگرت لە ڕێگەی ${getPartnerName(loanForm.partner)}`)
              : (isPartnerDirect ? `Company took loan from ${person}` : `Company took loan from ${person} via ${loanForm.partner}`))
          : (lang === 'ku'
              ? (isPartnerDirect ? `کۆمپانیا قەرزی دا بە ${getPartnerName(person)} (${getPartnerName(person)} داوای قەرزی لە کۆمپانیا کرد)` : `کۆمپانیا قەرزی دا بە (${person}) لە ڕێگەی ${getPartnerName(loanForm.partner)}`)
              : (isPartnerDirect ? `Company gave loan to ${person} (${person} asked for loan from company)` : `Company gave loan to ${person} via ${loanForm.partner}`));

        if (editingLoan) {
          const diff = amt - editingLoan.amount;
          const newRemaining = Math.max(0, editingLoan.remainingAmount + diff);

          const updatedLoan = {
            ...editingLoan,
            direction: loanForm.direction,
            partner: loanForm.partner,
            personName: person,
            amount: amt,
            currency: loanForm.currency,
            accountId: loanForm.accountId,
            remainingAmount: newRemaining,
            status: newRemaining === 0 ? 'paid' : 'active',
            date: loanForm.date,
            notes: loanForm.notes.trim() || defaultMemo
          };

          setLoans(prev => prev.map(l => (l.id === editingLoan.id ? updatedLoan : l)));
          if (typeof api !== 'undefined' && api.updateLoan) {
            try { await api.updateLoan(editingLoan.id, updatedLoan); } catch (e) {}
          }

          if (editingLoan.txId) {
            setTransactions(prev => prev.map(tx => {
              if (tx.id === editingLoan.txId) {
                const updatedTx = {
                  ...tx,
                  type: txType,
                  amount: amt,
                  currency: loanForm.currency,
                  accountId: loanForm.accountId,
                  partner: loanForm.partner,
                  category: txCategory,
                  notes: loanForm.notes.trim() || defaultMemo,
                  date: loanForm.date
                };
                if (typeof api !== 'undefined' && api.updateTransaction) {
                  api.updateTransaction(tx.id, updatedTx).catch(() => {});
                }
                return updatedTx;
              }
              return tx;
            }));
          }

          setEditingLoan(null);
          setIsLoanModalOpen(false);
          triggerToast(lang === 'ku' ? 'تۆماری قەرزەکە بە سەرکەوتوویی نوێکرایەوە' : 'Loan record updated successfully!');
          return;
        }

        const loanId = `LN-${Date.now().toString().slice(-5)}`;
        const invoiceNum = generateNextInvoiceNumber(transactions);

        const newTx = {
          id: `TX-${Date.now().toString().slice(-5)}`,
          refNumber: invoiceNum,
          type: txType,
          amount: amt,
          currency: loanForm.currency,
          exchangeRate: lockedRate,
          amountIQD: loanForm.currency === 'USD' ? amt * lockedRate : amt,
          accountId: loanForm.accountId,
          toAccountId: null,
          partner: loanForm.partner,
          category: txCategory,
          notes: loanForm.notes.trim() || defaultMemo,
          date: loanForm.date
        };

        const newLoan = {
          id: loanId,
          direction: loanForm.direction,
          partner: loanForm.partner,
          personName: person,
          amount: amt,
          currency: loanForm.currency,
          exchangeRate: lockedRate,
          accountId: loanForm.accountId,
          remainingAmount: amt,
          status: 'active',
          date: loanForm.date,
          notes: loanForm.notes.trim() || defaultMemo,
          txId: newTx.id,
          allowAdditional: true
        };

        setLoans(prev => [newLoan, ...prev]);
        setTransactions(prev => [newTx, ...prev]);
        if (typeof api !== 'undefined') {
          if (api.createLoan) api.createLoan(newLoan).catch(() => {});
          if (api.createTransaction) api.createTransaction(newTx).catch(() => {});
        }
        setIsLoanModalOpen(false);

        const accName = ACCOUNTS[loanForm.accountId]?.shortNameKu || ACCOUNTS[loanForm.accountId]?.shortName || loanForm.accountId;
        const partyLabel = isPartnerDirect ? getPartnerName(person) : person;
        triggerToast(lang === 'ku' 
          ? (isBorrowed 
              ? `قەرزەکە تۆمارکرا: کۆمپانیا قەرزی لە ${partyLabel} وەرگرت (+ باڵانس لە ${accName} زیادکرا)` 
              : `قەرزەکە تۆمارکرا: کۆمپانیا قەرزی دا بە ${partyLabel} (- باڵانس لە ${accName} کەمکرا)`)
          : (isBorrowed 
              ? `Loan recorded: Company took loan from ${partyLabel} (+ Balance added to ${accName})` 
              : `Loan recorded: Company gave loan to ${partyLabel} (- Balance deducted from ${accName})`));
      };

      const handleRepayLoan = async (e) => {
        e.preventDefault();
        if (!repayingLoan) return;
        const repayAmt = Number(repayForm.amount);
        if (!repayAmt || repayAmt <= 0) {
          triggerToast(lang === 'ku' ? 'تکایە بڕی دانەوە دیاریبکە' : 'Please enter a valid repayment amount greater than 0.');
          return;
        }
        if (repayAmt > repayingLoan.remainingAmount) {
          triggerToast(lang === 'ku' ? 'بڕی دانەوە ناتوانێت لە بڕی قەرز زیاتر بێت' : 'Repayment cannot exceed remaining loan balance.');
          return;
        }

        const invoiceNum = generateNextInvoiceNumber(transactions);
        const isBorrowed = repayingLoan.direction === 'borrowed';
        const lockedRate = repayingLoan.exchangeRate || exchangeRate;
        const newRemaining = Math.max(0, repayingLoan.remainingAmount - repayAmt);
        const isFullPayoff = newRemaining === 0;

        const txType = isBorrowed ? 'expense' : 'income';
        const txCategory = isBorrowed ? 'Partner Loan Repayment' : 'Company Loan Repayment';
        const defaultMemo = isBorrowed
          ? (isFullPayoff
              ? (lang === 'ku' ? `دانەوەی تەواوەتی قەرزی (${repayingLoan.personName}) لە ڕێگەی ${ACCOUNTS[repayForm.accountId]?.shortNameKu || repayForm.accountId}` : `Full settlement of loan borrowed from ${repayingLoan.personName} via ${ACCOUNTS[repayForm.accountId]?.shortName || repayForm.accountId}`)
              : (lang === 'ku' ? `دانەوەی بەشەکی (${repayAmt.toLocaleString()}) لە قەرزی (${repayingLoan.personName}) - ماوە: ${newRemaining.toLocaleString()}` : `Partial loan repayment to ${repayingLoan.personName} (${repayAmt.toLocaleString()}) • Remaining: ${newRemaining.toLocaleString()}`))
          : (isFullPayoff
              ? (lang === 'ku' ? `وەرگرتنەوەی تەواوەتی قەرزی دراو بە (${repayingLoan.personName}) بۆ ${ACCOUNTS[repayForm.accountId]?.shortNameKu || repayForm.accountId}` : `Full collection of loan given to ${repayingLoan.personName} into ${ACCOUNTS[repayForm.accountId]?.shortName || repayForm.accountId}`)
              : (lang === 'ku' ? `وەرگرتنەوەی بەشەکی (${repayAmt.toLocaleString()}) لە قەرزی (${repayingLoan.personName}) - ماوە: ${newRemaining.toLocaleString()}` : `Partial loan collection from ${repayingLoan.personName} (${repayAmt.toLocaleString()}) • Remaining: ${newRemaining.toLocaleString()}`));

        const newTx = {
          id: `TX-${Date.now().toString().slice(-5)}`,
          refNumber: invoiceNum,
          type: txType,
          amount: repayAmt,
          currency: repayingLoan.currency,
          exchangeRate: lockedRate,
          amountIQD: repayingLoan.currency === 'USD' ? repayAmt * lockedRate : repayAmt,
          accountId: repayForm.accountId,
          toAccountId: null,
          partner: repayingLoan.partner,
          category: txCategory,
          notes: repayForm.notes.trim() || defaultMemo,
          date: repayForm.date
        };

        const newRepayment = {
          id: `REP-${Date.now().toString().slice(-5)}`,
          loanId: repayingLoan.id,
          personName: repayingLoan.personName,
          partner: repayingLoan.partner,
          amount: repayAmt,
          currency: repayingLoan.currency,
          exchangeRate: lockedRate,
          amountIQD: repayingLoan.currency === 'USD' ? repayAmt * lockedRate : repayAmt,
          accountId: repayForm.accountId,
          date: repayForm.date,
          notes: repayForm.notes.trim() || defaultMemo,
          txId: newTx.id,
          createdAt: new Date().toISOString()
        };

        const newStatus = isFullPayoff ? 'paid' : 'active';
        setLoans(prev => prev.map(l => {
          if (l.id === repayingLoan.id) {
            return {
              ...l,
              remainingAmount: newRemaining,
              status: newStatus
            };
          }
          return l;
        }));

        setTransactions(prev => [newTx, ...prev]);
        setLoanRepayments(prev => [newRepayment, ...prev]);

        if (typeof api !== 'undefined') {
          if (api.updateLoan) api.updateLoan(repayingLoan.id, { remainingAmount: newRemaining, status: newStatus }).catch(() => {});
          if (api.createTransaction) api.createTransaction(newTx).catch(() => {});
          if (api.createLoanRepayment) api.createLoanRepayment(newRepayment).catch(() => {});
        }
        setRepayingLoan(null);

        const accName = ACCOUNTS[repayForm.accountId]?.shortNameKu || ACCOUNTS[repayForm.accountId]?.shortName || repayForm.accountId;
        if (isFullPayoff) {
          triggerToast(lang === 'ku'
            ? `🎉 قەرزەکە بە تەواوی دانراوە (${formatIQD(toIQD({ ...repayingLoan, amount: repayAmt }))}) لە ${accName}`
            : `🎉 Loan fully settled! Payment of ${formatIQD(toIQD({ ...repayingLoan, amount: repayAmt }))} completed in ${accName}.`);
        } else {
          triggerToast(lang === 'ku'
            ? `✅ پارەدانی بەشەکی بە سەرکەوتوویی تۆمارکرا (${formatIQD(toIQD({ ...repayingLoan, amount: repayAmt }))}). بڕی ماوە: ${formatIQD(toIQD({ ...repayingLoan, amount: newRemaining }))}`
            : `✅ Partial repayment of ${formatIQD(toIQD({ ...repayingLoan, amount: repayAmt }))} processed! Remaining debt: ${formatIQD(toIQD({ ...repayingLoan, amount: newRemaining }))}.`);
        }
      };

      const handleDeleteLoan = (loanId) => {
        if (!isAdmin) return;
        setConfirmDialog({
          title: lang === 'ku' ? 'سڕینەوەی تۆماری قەرز' : 'Delete Loan Record',
          message: lang === 'ku' 
            ? 'ئایا دڵنیایت لە سڕینەوەی ئەم تۆمارەی قەرز؟ ئەم کردارە پاشگەزبوونەوەی نییە.'
            : 'Are you sure you want to delete this loan record? This action cannot be undone.',
          confirmLabel: t.deleteConfirm,
          confirmColor: 'bg-rose-600 hover:bg-rose-700',
          onConfirm: async () => {
            setLoans(prev => prev.filter(l => l.id !== loanId));
            if (typeof api !== 'undefined' && api.deleteLoan) {
              try { await api.deleteLoan(loanId); } catch (e) {}
            }
            triggerToast(lang === 'ku' ? 'تۆماری قەرزەکە سڕایەوە' : 'Loan record removed.');
            setConfirmDialog(null);
          }
        });
      };

      const handleDeleteTx = (id) => {
        if (!isAdmin) return;
        setConfirmDialog({
          title: t.deleteModalTitle,
          message: t.deleteModalMessage,
          confirmLabel: t.deleteConfirm,
          confirmColor: 'bg-rose-600 hover:bg-rose-700',
          onConfirm: async () => {
            setTransactions((prev) => prev.filter((t) => t.id !== id));
            if (typeof api !== 'undefined' && api.deleteTransaction) {
              try { await api.deleteTransaction(id); } catch (e) {}
            }
            triggerToast(lang === 'ku' ? 'تۆمارەکە سڕایەوە' : 'Transaction removed.');
            setConfirmDialog(null);
          }
        });
      };

      // Wipe only transactions (keeps opening balances intact)
      const handleClearAllTransactions = () => {
        if (!isAdmin) return;
        setDeleteAllStep(1);
        setDeleteAllPassword('');
        setDeleteAllError('');
        setIsDeleteAllModalOpen(true);
      };

      // Full system reset: zero out opening balances + zero out transactions
      const handleResetEverything = () => {
        setConfirmDialog({
          title: lang === 'ku' ? 'سفرکردنەوەی تەواوەتی سیستەم' : 'Full System Factory Reset',
          message: lang === 'ku' 
            ? 'ئاگاداربە! ئەم کردارە هەموو باڵانسی سەرەتایی هەژمارەکان دەکاتە ٠ و هەموو تۆمارەکانیش بە تەواوی دەسڕێتەوە. هیچ داتایەک ناگەڕێتەوە.' 
            : 'Warning! This will zero out all opening account balances and delete all logged transactions. This cannot be undone.',
          confirmLabel: lang === 'ku' ? 'سفرکردنەوەی گشتی' : 'Reset Everything to 0',
          confirmColor: 'bg-red-700 hover:bg-red-800',
          onConfirm: async () => {
            setTransactions([]);
            setLoans([]);
            const zeros = { fib: 0, cihan: 0, qi: 0, hyperpost: 0, cash: 0 };
            setOpeningBalances(zeros);
            setOpeningForm(zeros);
            localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify([]));
            localStorage.setItem('ordercenter_loans_v1', JSON.stringify([]));
            localStorage.setItem('ordercenter_opening_balances', JSON.stringify(zeros));
            if (typeof api !== 'undefined') {
              if (api.clearAllTransactions) await api.clearAllTransactions().catch(() => {});
              if (api.clearAllLoans) await api.clearAllLoans().catch(() => {});
              if (api.setBalances) await api.setBalances(zeros).catch(() => {});
            }
            triggerToast(lang === 'ku' ? 'سیستەمەکە بە تەواوی سفر کرایەوە' : 'System reset to zero.');
            setConfirmDialog(null);
          }
        });
      };

      // Save Opening Balances & Exchange Rate from Settings Tab
      const handleSaveOpeningBalances = async (e) => {
        e.preventDefault();
        const updatedBalances = {
          fib: Math.max(0, Number(openingForm.fib) || 0),
          cihan: Math.max(0, Number(openingForm.cihan) || 0),
          qi: Math.max(0, Number(openingForm.qi) || 0),
          hyperpost: Math.max(0, Number(openingForm.hyperpost) || 0),
          cash: Math.max(0, Number(openingForm.cash) || 0)
        };
        const newRate = Math.max(1, Number(exchangeRateForm) || 1500);

        setOpeningBalances(updatedBalances);
        setExchangeRate(newRate);
        localStorage.setItem('ordercenter_opening_balances', JSON.stringify(updatedBalances));
        localStorage.setItem('ordercenter_usd_rate', newRate.toString());

        if (typeof api !== 'undefined' && api.setBalances) {
          try {
            await api.setBalances(updatedBalances);
          } catch (err) {
            console.warn('Could not sync balances to server:', err);
          }
        }

        triggerToast(lang === 'ku' ? 'ڕێکخستنەکان و نرخی دۆلار پاشەکەوت کران (داتای پێشتر نەگۆڕاوە)' : 'Settings & USD Rate saved! Previous data remains locked.');
      };

      const exportCSV = () => {
        if (!isAdmin) return;
        const headers = ['Ref #', 'Date & Time', 'Type', 'Amount', 'Currency', 'Amount (IQD)', 'Source Account', 'Destination Account', 'Partner / User', 'Category', 'Notes'];
        const rows = filteredTransactions.map((tx) => [
          tx.refNumber || tx.id,
          tx.date.replace('T', ' '),
          tx.type.toUpperCase(),
          tx.amount,
          tx.currency,
          toIQD(tx),
          ACCOUNTS[tx.accountId]?.name || tx.accountId,
          tx.toAccountId ? ACCOUNTS[tx.toAccountId]?.name : 'N/A',
          tx.partner,
          `"${tx.category}"`,
          `"${tx.notes.replace(/"/g, '""')}"`
        ]);

        const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `OrderCenter_ERP_Ledger_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        triggerToast(lang === 'ku' ? 'فایلی CSV دابەزی' : 'Ledger exported to CSV.');
      };

      // ==========================================
      // BACKUP & RESTORE ACTIONS
      // ==========================================
      const [restoreModalData, setRestoreModalData] = useState(null);
      const [isRestoring, setIsRestoring] = useState(false);
      const [isBackingUp, setIsBackingUp] = useState(false);
      const backupFileInputRef = React.useRef(null);

      const handleDownloadBackup = async () => {
        try {
          setIsBackingUp(true);
          triggerToast('Creating full system backup...');
          let backup = null;
          if (typeof api !== 'undefined' && api.getBackup) {
            try {
              backup = await api.getBackup();
            } catch (e) {
              console.warn('[API] Server backup fetch error, creating client snapshot:', e);
            }
          }
          if (!backup) {
            backup = {
              version: '2.4.0',
              system: 'Order Center ERP',
              exportedAt: new Date().toISOString(),
              transactions,
              openingBalances,
              loans,
              users,
              categories,
              exchangeRate
            };
          }

          // Ensure categories and exchangeRate are attached
          backup.categories = categories;
          backup.exchangeRate = exchangeRate;

          const jsonStr = JSON.stringify(backup, null, 2);
          const blob = new Blob([jsonStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const d = new Date();
          const pad = (n) => String(n).padStart(2, '0');
          const dateStr = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}`;
          a.href = url;
          a.download = `ordercenter_erp_backup_${dateStr}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          setIsBackingUp(false);
          triggerToast('Backup file downloaded successfully!');
        } catch (err) {
          setIsBackingUp(false);
          console.error(err);
          triggerToast('Failed to create backup: ' + err.message);
        }
      };

      const handleRestoreFileSelect = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (!parsed || (!parsed.transactions && !parsed.openingBalances && !parsed.loans)) {
              triggerToast('Invalid backup file. Missing ERP data structure.');
              return;
            }
            setRestoreModalData(parsed);
          } catch (err) {
            triggerToast('Failed to parse backup JSON file.');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const handleConfirmRestore = async () => {
        if (!restoreModalData) return;
        try {
          setIsRestoring(true);
          triggerToast('Restoring all ERP records from backup...');
          if (typeof api !== 'undefined' && api.restoreBackup) {
            await api.restoreBackup(restoreModalData);
          }
          if (restoreModalData.categories) {
            setCategories(restoreModalData.categories);
            localStorage.setItem('ordercenter_categories_v1', JSON.stringify(restoreModalData.categories));
          }
          if (restoreModalData.exchangeRate) {
            setExchangeRate(Number(restoreModalData.exchangeRate));
            localStorage.setItem('ordercenter_usd_rate', restoreModalData.exchangeRate.toString());
          }
          await loadServerData();
          setIsRestoring(false);
          setRestoreModalData(null);
          triggerToast('System successfully restored from backup!');
        } catch (err) {
          setIsRestoring(false);
          triggerToast('Failed to restore backup: ' + err.message);
        }
      };

      const partnerSettlement = useMemo(() => {
        // Any money given to the company by Sarwar or Wazham is added directly to Income Brought
        const sarwarIncome = (metrics.partnerIncomes.Sarwar || 0) + ((metrics.partnerLoansBorrowed && metrics.partnerLoansBorrowed.Sarwar) || 0);
        const wazhamIncome = (metrics.partnerIncomes.Wazham || 0) + ((metrics.partnerLoansBorrowed && metrics.partnerLoansBorrowed.Wazham) || 0);

        const sarwarLoan = metrics.partnerLoans.Sarwar;
        const wazhamLoan = metrics.partnerLoans.Wazham;

        const sarwarNetDue = sarwarIncome - sarwarLoan;
        const wazhamNetDue = wazhamIncome - wazhamLoan;

        return {
          sarwarIncome,
          wazhamIncome,
          sarwarEntitled: sarwarIncome,
          wazhamEntitled: wazhamIncome,
          sarwarWithdrawn: 0,
          wazhamWithdrawn: 0,
          sarwarLoan,
          wazhamLoan,
          sarwarLoanBorrowed: 0,
          wazhamLoanBorrowed: 0,
          sarwarNetDue,
          wazhamNetDue
        };
      }, [metrics]);

      // Helper for Account Name based on language
      const getAccountName = (acc) => (lang === 'ku' ? acc.nameKu : acc.name);
      const getAccountShortName = (acc) => (lang === 'ku' ? acc.shortNameKu : acc.shortName);
      const getPartnerName = (p) => {
        if (!p || p === 'none' || p === 'Company' || p === 'General') {
          return lang === 'ku' ? 'کۆمپانیا (گشتی)' : 'Company (General)';
        }
        const s = p.toString().trim().toLowerCase();
        if (s === 'sarwar' || s === 'سەروەر') {
          return lang === 'ku' ? 'سەروەر' : 'Sarwar';
        }
        if (s === 'wazham' || s === 'واژام') {
          return lang === 'ku' ? 'واژام' : 'Wazham';
        }
        return p;
      };

      if (!currentUser) {
        return (
          <LoginScreen
            users={users}
            userPasswords={userPasswords}
            onLogin={async (user) => {
              setCurrentUser(user);
              localStorage.setItem('ordercenter_session', JSON.stringify(user));
              await loadServerData();
              triggerToast(`Welcome back, ${user.name}!`);
            }}
          />
        );
      }


      return (
        <div className={`min-h-screen ${isRtl ? 'font-nrt' : ''}`}>
          
          {/* ===================== DEDICATED A4 PRINT STATEMENT (VISIBLE ONLY ON PRINT) ===================== */}
          <section className="print-only-statement p-2">
            {/* Header / Letterhead */}
            <div className="flex items-start justify-between pb-4 border-b-2 border-slate-900 mb-4">
              <div>
                <h1 className="text-2xl font-black text-slate-950 uppercase tracking-tight">Order Center</h1>
                <p className="text-sm font-bold text-slate-700 mt-0.5">
                  {lang === 'ku' ? 'ڕاپۆرتی فەرمی دارایی و خەزێنە' : 'Official Treasury & Financial Statement'}
                </p>
                <p className="text-xs text-slate-500">
                  {lang === 'ku' ? 'بەرواری دەرکردن:' : 'Generated Date:'} {new Date().toLocaleString(lang === 'ku' ? 'ckb-IQ' : 'en-US')}
                </p>
              </div>
              <div className={isRtl ? 'text-left' : 'text-right'}>
                <span className="text-xs uppercase font-extrabold px-2.5 py-1 bg-slate-100 border border-slate-300 rounded text-slate-800">
                  A4 Executive Audit
                </span>
                <p className="text-xs text-slate-600 mt-2">
                  {lang === 'ku' ? 'پشکی هاوبەشەکان: سەروەر (٥٠٪) • واژام (٥٠٪)' : 'Partners: Sarwar (50%) • Wazham (50%)'}
                </p>
              </div>
            </div>

            {/* Financial Snapshot Summary Cards */}
            <div className="grid grid-cols-4 gap-3 mb-5 print-card">
              <div className="p-3 border border-slate-300 rounded-lg bg-slate-50">
                <span className="text-[10px] font-bold text-slate-500 uppercase">{t.totalLiquidity}</span>
                <div className="text-base font-black text-slate-900 mt-0.5">{formatIQD(totalConsolidatedLiquidity)}</div>
                <div className="text-[10px] text-slate-500 font-semibold">≈ {formatUSD(totalConsolidatedLiquidity)}</div>
              </div>
              <div className="p-3 border border-slate-300 rounded-lg bg-slate-50">
                <span className="text-[10px] font-bold text-slate-500 uppercase">{t.totalRevenue}</span>
                <div className="text-base font-black text-emerald-700 mt-0.5">+{formatIQD(metrics.totalRevenue)}</div>
              </div>
              <div className="p-3 border border-slate-300 rounded-lg bg-slate-50">
                <span className="text-[10px] font-bold text-slate-500 uppercase">{t.totalExpenses}</span>
                <div className="text-base font-black text-rose-700 mt-0.5">-{formatIQD(metrics.totalExpenses)}</div>
              </div>
              <div className="p-3 border border-slate-300 rounded-lg bg-slate-50">
                <span className="text-[10px] font-bold text-slate-500 uppercase">{t.netProfit}</span>
                <div className="text-base font-black text-indigo-900 mt-0.5">{formatIQD(metrics.netProfit)}</div>
              </div>
            </div>

            {/* 5 Accounts Balance Breakdown */}
            <div className="mb-5 border border-slate-300 rounded-lg p-3 print-card bg-white">
              <h4 className="text-xs font-black uppercase text-slate-700 mb-2">
                {lang === 'ku' ? 'دابەشبوونی نەختینە بەسەر ٥ هەژمارەکەدا' : '5 Account Liquidity Distribution'}
              </h4>
              <div className="grid grid-cols-5 gap-2 text-center">
                {Object.values(ACCOUNTS).map((acc) => (
                  <div key={acc.id} className="p-2 border border-slate-200 rounded bg-slate-50">
                    <span className="text-[10px] font-bold text-slate-600 block">{getAccountShortName(acc)}</span>
                    <span className="text-xs font-black text-slate-900 mt-0.5 block">{formatIQD(accountBalances[acc.id] || 0)}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Filter Scope Note */}
            <div className="mb-2 text-xs font-bold text-slate-600 flex items-center justify-between">
              <span>
                {lang === 'ku' ? 'تۆماری جووڵە داراییەکان (تۆمارە فلتەرکراوەکان):' : 'General Ledger Records (Filtered Scope):'} {filteredTransactions.length} {lang === 'ku' ? 'جووڵە' : 'records'}
              </span>
              <span>{t.exchangeRateNote} {exchangeRate} IQD</span>
            </div>

            {/* Ledger Table for Print */}
            <table className="w-full text-xs text-slate-900 border border-slate-300">
              <thead>
                <tr className="bg-slate-200 text-slate-800 text-[10px] uppercase font-black text-start">
                  <th className="p-2 border-b border-slate-400">#</th>
                  <th className="p-2 border-b border-slate-400">{t.colRefDate}</th>
