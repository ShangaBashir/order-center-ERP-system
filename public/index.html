    // ==========================================
    // REST API CLIENT (CONNECTS TO NODE.JS & SQLITE)
    // ==========================================
    const isNodeBackend = window.location.protocol.startsWith('http');
    
    const api = {
      getToken: () => localStorage.getItem('ordercenter_token'),
      setToken: (t) => localStorage.setItem('ordercenter_token', t),
      clearToken: () => localStorage.removeItem('ordercenter_token'),
      
      headers: () => ({
        'Content-Type': 'application/json',
        ...(localStorage.getItem('ordercenter_token') ? { 'Authorization': `Bearer ${localStorage.getItem('ordercenter_token')}` } : {})
      }),

      async login(username, password) {
        if (!isNodeBackend) {
          // Fallback if opened directly via file://
          const savedUsers = JSON.parse(localStorage.getItem('ordercenter_users') || '[]');
          const user = savedUsers.find(u => u.username.toLowerCase() === username.trim().toLowerCase());
          if (!user) throw new Error('Account not found.');
          if (!user.active) throw new Error('Account is suspended.');
          const passwords = JSON.parse(localStorage.getItem('ordercenter_passwords') || '{}');
          if (password !== (passwords[user.username] || 'admin123')) throw new Error('Incorrect password.');
          return { token: 'mock_token', user };
        }
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        this.setToken(data.token);
        return data;
      },

      async getMe() {
        if (!isNodeBackend) return JSON.parse(localStorage.getItem('ordercenter_session') || 'null');
        const token = this.getToken();
        if (!token) return null;
        try {
          const res = await fetch('/api/auth/me', { headers: this.headers() });
          if (!res.ok) { this.clearToken(); return null; }
          const data = await res.json();
          return data.user;
        } catch (e) {
          return null;
        }
      },

      async logout() {
        if (isNodeBackend) {
          await fetch('/api/auth/logout', { method: 'POST', headers: this.headers() }).catch(() => {});
        }
        this.clearToken();
      },

      async getTransactions() {
        if (!isNodeBackend) return JSON.parse(localStorage.getItem('ordercenter_erp_v1_txs') || '[]');
        const res = await fetch('/api/transactions', { headers: this.headers() });
        const data = await res.json();
        return data.transactions || [];
      },

      async createTransaction(tx) {
        if (!isNodeBackend) {
          const txs = JSON.parse(localStorage.getItem('ordercenter_erp_v1_txs') || '[]');
          const newTx = { ...tx, id: 'tx_' + Date.now(), createdAt: new Date().toISOString() };
          localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify([newTx, ...txs]));
          return newTx;
        }
        const res = await fetch('/api/transactions', {
          method: 'POST',
          headers: this.headers(),
          body: JSON.stringify(tx)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to create transaction');
        return data.transaction;
      },

      async updateTransaction(id, tx) {
        if (!isNodeBackend) {
          const txs = JSON.parse(localStorage.getItem('ordercenter_erp_v1_txs') || '[]');
          const updated = txs.map(t => t.id === id ? { ...t, ...tx } : t);
          localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify(updated));
          return tx;
        }
        const res = await fetch(`/api/transactions/${id}`, {
          method: 'PUT',
          headers: this.headers(),
          body: JSON.stringify(tx)
        });
        const data = await res.json();
        return data.transaction;
      },

      async deleteTransaction(id) {
        if (!isNodeBackend) {
          const txs = JSON.parse(localStorage.getItem('ordercenter_erp_v1_txs') || '[]');
          localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify(txs.filter(t => t.id !== id)));
          return true;
        }
        await fetch(`/api/transactions/${id}`, { method: 'DELETE', headers: this.headers() });
        return true;
      },

      async clearAllTransactions() {
        if (!isNodeBackend) {
          localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify([]));
          return true;
        }
        await fetch('/api/transactions/clear-all', { method: 'POST', headers: this.headers() });
        return true;
      },

      async getBalances() {
        if (!isNodeBackend) return JSON.parse(localStorage.getItem('ordercenter_opening_balances') || '{"fib":0,"cihan":0,"qi":0,"hyperpost":0,"cash":0}');
        const res = await fetch('/api/balances', { headers: this.headers() });
        const data = await res.json();
        return data.balances;
      },

      async setBalances(balances) {
        if (!isNodeBackend) {
          localStorage.setItem('ordercenter_opening_balances', JSON.stringify(balances));
          return balances;
        }
        const res = await fetch('/api/balances', {
          method: 'PUT',
          headers: this.headers(),
          body: JSON.stringify(balances)
        });
        const data = await res.json();
        return data.balances;
      },

      async getUsers() {
        if (!isNodeBackend) return JSON.parse(localStorage.getItem('ordercenter_users') || '[]');
        const res = await fetch('/api/users', { headers: this.headers() });
        if (!res.ok) return [];
        const data = await res.json();
        return data.users || [];
      },

      async createUser(userData) {
        if (!isNodeBackend) {
          const users = JSON.parse(localStorage.getItem('ordercenter_users') || '[]');
          const newUser = { id: 'usr_' + Date.now(), ...userData, role: 'user', active: 1, createdAt: new Date().toISOString().split('T')[0] };
          users.push(newUser);
          localStorage.setItem('ordercenter_users', JSON.stringify(users));
          return newUser;
        }
        const res = await fetch('/api/users', {
          method: 'POST',
          headers: this.headers(),
          body: JSON.stringify(userData)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to create user');
        return data.user;
      },

      async toggleUserStatus(id, active) {
        if (!isNodeBackend) {
          const users = JSON.parse(localStorage.getItem('ordercenter_users') || '[]');
          const updated = users.map(u => u.id === id ? { ...u, active: active ? 1 : 0 } : u);
          localStorage.setItem('ordercenter_users', JSON.stringify(updated));
          return true;
        }
        await fetch(`/api/users/${id}/status`, {
          method: 'PATCH',
          headers: this.headers(),
          body: JSON.stringify({ active })
        });
        return true;
      },

      async resetPassword(userId, newPassword) {
        if (!isNodeBackend) return true;
        const res = await fetch(`/api/users/${userId}/password`, {
          method: 'PUT',
          headers: this.headers(),
          body: JSON.stringify({ newPassword })
        });
        if (!res.ok) {
          const d = await res.json();
          throw new Error(d.error || 'Failed to reset password');
        }
        return true;
      },

      async deleteUser(id) {
        if (!isNodeBackend) {
          const users = JSON.parse(localStorage.getItem('ordercenter_users') || '[]');
          localStorage.setItem('ordercenter_users', JSON.stringify(users.filter(u => u.id !== id)));
          return true;
        }
        await fetch(`/api/users/${id}`, { method: 'DELETE', headers: this.headers() });
        return true;
      }
    };

              </div>
              <h1 className="text-3xl font-black text-white tracking-tight">Order Center</h1>
              <p className="text-xs font-bold tracking-widest text-slate-300 uppercase mt-1">
                Global Shopping & Shipping
              </p>
              <div className="inline-flex items-center gap-1.5 mt-3 px-3 py-1 rounded-full bg-white/10 border border-white/10 text-white/90 text-xs font-semibold backdrop-blur-md">

            {/* Login Card */}

              {error && (

                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">Password</label>
                  <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                      <Icon name="lock" className="w-4 h-4" />
                    </div>
                    <input
                      type={showPassword ? 'text' : 'password'}
                      required
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      placeholder="Enter your password"
                      className="w-full pl-10 pr-11 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#711612] focus:bg-white transition"
                    />
                    <button
                      type="button"
                      onClick={() => setShowPassword(!showPassword)}
                      className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600"
                    >
                      <Icon name={showPassword ? 'eye-off' : 'eye'} className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                <div className="pt-2">
                  <button
                    type="submit"
                    disabled={isLoading}
                    className="w-full py-3.5 px-4 bg-gradient-to-r from-[#711612] to-[#94201C] hover:from-[#5A0E0B] hover:to-[#7E1A16] text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg shadow-[#711612]/30 transition transform active:scale-[0.99] disabled:opacity-50 flex items-center justify-center gap-2"
                  >
                    {isLoading ? (
                      <span className="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                    ) : (
                      <>
                        <Icon name="log-in" className="w-4 h-4" />
                        <span>Sign In to Dashboard</span>
                      </>
                    )}
                  </button>
                </div>
              </form>

              </div>
            <p className="text-center text-xs text-slate-400 mt-6 font-medium">
              Order Center ERP · Secure Corporate Financial Management
            </p>
          </div>
        </div>
      );
    }

    function App() {
      // Language State (Permanently English - Kurdish removed)

      // Sync with Node.js & SQLite Database on Mount
      useEffect(() => {
        async function loadServerData() {
          try {
            const me = await api.getMe();
            if (me) {
              setCurrentUser(me);
              const [serverTxs, serverBalances] = await Promise.all([
                api.getTransactions(),
                api.getBalances()
              ]);
              setTransactions(serverTxs);
              setOpeningBalances(serverBalances);

              if (me.role === 'admin') {
                const serverUsers = await api.getUsers();
                if (serverUsers && serverUsers.length > 0) setUsers(serverUsers);
              }
            }
          } catch (e) {
            console.warn('[Sync] Falling back to local data store:', e);
          }
        }
        loadServerData();
      }, []);

      const lang = 'en';
      const t = TRANSLATIONS.en;
      const isRtl = false;

      // Authentication & Users State
      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem('ordercenter_users');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) {
              // Ensure admin is named Wazham and has admin role
              const updated = parsed.map(u => u.username === 'admin' ? { ...u, name: 'Wazham', role: 'admin', partner: 'Wazham' } : u);
              localStorage.setItem('ordercenter_users', JSON.stringify(updated));
              return updated;
            }
          } catch (e) {}
        }
        const defaultUsers = [
          { id: 'usr_admin', name: 'Wazham', username: 'admin', role: 'admin', partner: 'Wazham', createdAt: '2026-01-01', active: true },
          { id: 'usr_staff', name: 'Staff User', username: 'user', role: 'user', partner: 'Staff', createdAt: '2026-01-15', active: true }
        ];
        localStorage.setItem('ordercenter_users', JSON.stringify(defaultUsers));
        return defaultUsers;
      });

      const [userPasswords, setUserPasswords] = useState(() => {
        const saved = localStorage.getItem('ordercenter_passwords');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return {
          admin: 'admin123',
          wazham: 'wazham123',
          user: 'user123'
        };
      });

      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('ordercenter_session');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed && (parsed.username === 'admin' || parsed.role === 'admin')) {
              const updatedAdmin = { ...parsed, name: 'Wazham', role: 'admin', partner: 'Wazham' };
              localStorage.setItem('ordercenter_session', JSON.stringify(updatedAdmin));
              return updatedAdmin;
            }
            return parsed;
          } catch (e) {}
        }
        return null;
      });

      // Modals for User Management
      const [isAddUserModalOpen, setIsAddUserModalOpen] = useState(false);
      const [newUserForm, setNewUserForm] = useState({
        name: '',
        username: '',
        password: '',
        role: 'user',
        partner: 'Staff'
      });
      const [resetPasswordModal, setResetPasswordModal] = useState({
        isOpen: false,
        username: '',
        name: '',
        newPassword: ''
      });

      const handleLogout = () => {
        setConfirmDialog({
          title: 'Sign Out Confirmation',
          message: 'Are you sure you want to log out of the Order Center portal?',
          confirmLabel: 'Yes, Sign Out',
          confirmColor: 'bg-[#711612] hover:bg-[#5A0E0B]',
          onConfirm: async () => {
            if (typeof api !== 'undefined' && api.logout) {
              await api.logout();
            }
            setCurrentUser(null);
            localStorage.removeItem('ordercenter_session');
            localStorage.removeItem('ordercenter_token');
            triggerToast('Signed out successfully.');
            setConfirmDialog(null);
          }
        });
      };

      const handleAddUser = (e) => {
        e.preventDefault();
        const trimmedUsername = newUserForm.username.trim().toLowerCase();
        if (!trimmedUsername || !newUserForm.name.trim() || !newUserForm.password.trim()) {
          triggerToast('Please fill in all required fields.');
          return;
        }

        if (users.some(u => u.username.toLowerCase() === trimmedUsername)) {
          triggerToast('Username is already taken. Please choose another.');
          return;
        }

        const newUser = {
          id: 'usr_' + Date.now(),
          name: newUserForm.name.trim(),
          username: trimmedUsername,
          role: 'user',
          partner: newUserForm.partner,
          createdAt: new Date().toISOString().split('T')[0],
          active: true
        };

        const updatedUsers = [...users, newUser];
        const updatedPasswords = { ...userPasswords, [trimmedUsername]: newUserForm.password.trim() };

        setUsers(updatedUsers);
        setUserPasswords(updatedPasswords);
        localStorage.setItem('ordercenter_users', JSON.stringify(updatedUsers));
        localStorage.setItem('ordercenter_passwords', JSON.stringify(updatedPasswords));

        setIsAddUserModalOpen(false);
        setNewUserForm({ name: '', username: '', password: '', role: 'user', partner: 'Staff' });
        triggerToast(`User "${newUser.name}" added successfully as ${newUser.role.toUpperCase()}!`);
      };

      const handleToggleUserStatus = (userId) => {
        const target = users.find(u => u.id === userId);
        if (!target) return;
        if (target.id === currentUser?.id) {
          triggerToast('You cannot deactivate your own current account.');
          return;
        }

        const updated = users.map(u => u.id === userId ? { ...u, active: !u.active } : u);
        setUsers(updated);
        localStorage.setItem('ordercenter_users', JSON.stringify(updated));
        triggerToast(`User ${target.name} is now ${!target.active ? 'Active' : 'Suspended'}.`);
      };

      const handleDeleteUser = (userId) => {
        const target = users.find(u => u.id === userId);
        if (!target) return;
        if (target.id === currentUser?.id) {
          triggerToast('You cannot delete your own account while signed in.');
          return;
        }

        setConfirmDialog({
          title: 'Delete User Account',
          message: `Are you sure you want to permanently delete the account for "${target.name}" (@${target.username})? This user will no longer be able to sign in.`,
          confirmLabel: 'Yes, Delete User',
          confirmColor: 'bg-rose-600 hover:bg-rose-700',
          onConfirm: () => {
            const updated = users.filter(u => u.id !== userId);
            setUsers(updated);
            localStorage.setItem('ordercenter_users', JSON.stringify(updated));
            triggerToast(`User ${target.name} removed.`);
            setConfirmDialog(null);
          }
        });
      };

      const handleSaveNewPassword = (e) => {
        e.preventDefault();
        if (!resetPasswordModal.newPassword.trim()) {
          triggerToast('Please provide a valid new password.');
          return;
        }

        const updatedPasswords = { ...userPasswords, [resetPasswordModal.username]: resetPasswordModal.newPassword.trim() };
        setUserPasswords(updatedPasswords);
        localStorage.setItem('ordercenter_passwords', JSON.stringify(updatedPasswords));
        triggerToast(`Password for @${resetPasswordModal.username} updated successfully.`);
        setResetPasswordModal({ isOpen: false, username: '', name: '', newPassword: '' });
      };


      useEffect(() => {
        document.documentElement.dir = 'ltr';
        document.documentElement.lang = 'en';
      }, []);

      // Transactions Store (Fresh, clean start)
      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('ordercenter_erp_v1_txs');
        if (!saved) return [];
        try {
          const parsed = JSON.parse(saved);
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      });

      // Opening Starting Balances for all 5 accounts (Stored in localStorage)
      const [openingBalances, setOpeningBalances] = useState(() => {
        const saved = localStorage.getItem('ordercenter_opening_balances');
        if (saved) {
          try {
            return JSON.parse(saved);
          } catch (e) {}
        }
        return { fib: 0, cihan: 0, qi: 0, hyperpost: 0, cash: 0 };
      });

      // Editable Opening Balances temporary form state for Settings Tab
      const [openingForm, setOpeningForm] = useState(openingBalances);

      // USD Exchange Rate
      const [exchangeRate, setExchangeRate] = useState(() => {
        const saved = localStorage.getItem('ordercenter_usd_rate');
        return saved ? Number(saved) : 1500;
      });

      // Current active tab: 'dashboard' | 'transactions' | 'partners' | 'analytics' | 'settings'
      const [activeTab, setActiveTab] = useState('dashboard');

      // Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedAccountFilter, setSelectedAccountFilter] = useState('all');
      const [selectedPartnerFilter, setSelectedPartnerFilter] = useState('all');
      const [selectedTypeFilter, setSelectedTypeFilter] = useState('all');
      const [dateFilter, setDateFilter] = useState('all');

      // Modals
      const [isTxModalOpen, setIsTxModalOpen] = useState(false);
      const [isTransferModalOpen, setIsTransferModalOpen] = useState(false);
      const [isSettlementModalOpen, setIsSettlementModalOpen] = useState(false);
      const [editingTx, setEditingTx] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const [confirmDialog, setConfirmDialog] = useState(null);

      // Form States
      const [txForm, setTxForm] = useState({
        type: 'income',
        amount: '',
        currency: 'IQD',
        accountId: 'fib',
        toAccountId: 'cash',
        partner: 'Sarwar',
        category: TRANSACTION_CATEGORIES.income[0],
        refNumber: '',
        notes: '',
        date: new Date().toISOString().slice(0, 16)
      });

      const [transferForm, setTransferForm] = useState({
        amount: '',
        currency: 'IQD',
        fromAccountId: 'cash',
        toAccountId: 'cihan',
        partner: 'Sarwar',
        notes: 'Account balance rebalancing',
        date: new Date().toISOString().slice(0, 16)
      });

      const [equityRatio, setEquityRatio] = useState({ Sarwar: 50, Wazham: 50 });

      // Save transactions to localStorage
      useEffect(() => {
        localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify(transactions));
      }, [transactions]);

      // Save opening balances to localStorage
      useEffect(() => {
        localStorage.setItem('ordercenter_opening_balances', JSON.stringify(openingBalances));
        setOpeningForm(openingBalances);
      }, [openingBalances]);

      // Save USD rate to localStorage
      useEffect(() => {
        localStorage.setItem('ordercenter_usd_rate', exchangeRate.toString());
      }, [exchangeRate]);

      // Toast Notification
      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      // Currency Helpers
      const toIQD = (amount, currency) => {
        const val = Number(amount) || 0;
        return currency === 'USD' ? val * exchangeRate : val;
      };

      const formatIQD = (val) => {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'IQD',
          maximumFractionDigits: 0
        }).format(val || 0).replace('IQD', lang === 'ku' ? 'د.ع' : 'IQD');
      };

      const formatUSD = (val) => {
        const usd = (val || 0) / (exchangeRate || 1500);
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          maximumFractionDigits: 2
        }).format(usd);
      };

      // Calculate Net Balances for all 5 accounts (Opening Balance + Transactions)
      const accountBalances = useMemo(() => {
        const balances = { 
          fib: Number(openingBalances.fib) || 0, 
          cihan: Number(openingBalances.cihan) || 0, 
          qi: Number(openingBalances.qi) || 0, 
          hyperpost: Number(openingBalances.hyperpost) || 0, 
          cash: Number(openingBalances.cash) || 0 
        };

        transactions.forEach((tx) => {
          const amtIQD = toIQD(tx.amount, tx.currency);
          if (tx.type === 'income') {
            balances[tx.accountId] = (balances[tx.accountId] || 0) + amtIQD;
          } else if (tx.type === 'expense' || tx.type === 'withdrawal') {
            balances[tx.accountId] = (balances[tx.accountId] || 0) - amtIQD;
          } else if (tx.type === 'transfer') {
            balances[tx.accountId] = (balances[tx.accountId] || 0) - amtIQD;
            if (tx.toAccountId) {
              balances[tx.toAccountId] = (balances[tx.toAccountId] || 0) + amtIQD;
            }
          }
        });
        return balances;
      }, [transactions, openingBalances, exchangeRate]);

      // Total Liquidity
      const totalConsolidatedLiquidity = useMemo(() => {
        return Object.values(accountBalances).reduce((acc, curr) => acc + curr, 0);
      }, [accountBalances]);

      // Metrics & Analytics
      const metrics = useMemo(() => {
        let totalRevenue = 0;
        let totalExpenses = 0;
        let partnerWithdrawals = { Sarwar: 0, Wazham: 0 };
        let partnerLoans = { Sarwar: 0, Wazham: 0 };

        transactions.forEach((tx) => {
          const amtIQD = toIQD(tx.amount, tx.currency);
          const cat = (tx.category || '').toLowerCase();
          const isLoan = cat.includes('loan') || cat.includes('advance');

          if (tx.type === 'withdrawal') {
            if (isLoan) {
              if (partnerLoans[tx.partner] !== undefined) {
                partnerLoans[tx.partner] += amtIQD;
              }
            } else {
              if (partnerWithdrawals[tx.partner] !== undefined) {
                partnerWithdrawals[tx.partner] += amtIQD;
              }
            }
          } else if (tx.type === 'income' && isLoan) {
            if (partnerLoans[tx.partner] !== undefined) {
              partnerLoans[tx.partner] = Math.max(0, partnerLoans[tx.partner] - amtIQD);
            }
          } else if (tx.type === 'income') {
            totalRevenue += amtIQD;
          } else if (tx.type === 'expense') {
            totalExpenses += amtIQD;
          }
        });

        const netProfit = totalRevenue - totalExpenses;
        const totalDrawings = partnerWithdrawals.Sarwar + partnerWithdrawals.Wazham;
        const totalLoans = partnerLoans.Sarwar + partnerLoans.Wazham;
        const netRetained = netProfit - totalDrawings - totalLoans;

        return {
          totalRevenue,
          totalExpenses,
          netProfit,
          netRetained,
          partnerWithdrawals,
          partnerLoans
        };
      }, [transactions, exchangeRate]);

      // Filtered Transactions
      const filteredTransactions = useMemo(() => {
        return transactions.filter((tx) => {
          const searchMatch = 
            (tx.notes || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (tx.category || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (tx.refNumber && tx.refNumber.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (tx.amount || '').toString().includes(searchQuery);

          const accountMatch = 
            selectedAccountFilter === 'all' || 
            tx.accountId === selectedAccountFilter || 
            tx.toAccountId === selectedAccountFilter;

          const partnerMatch = 
            selectedPartnerFilter === 'all' || 
            tx.partner === selectedPartnerFilter;

          const typeMatch = 
            selectedTypeFilter === 'all' || 
            tx.type === selectedTypeFilter;

          let dateMatch = true;
          if (dateFilter !== 'all') {
            const txDate = new Date(tx.date);
            const now = new Date();
            if (dateFilter === 'today') {
              dateMatch = txDate.toDateString() === now.toDateString();
            } else if (dateFilter === 'week') {
              const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
              dateMatch = txDate >= weekAgo;
            } else if (dateFilter === 'month') {
              dateMatch = txDate.getMonth() === now.getMonth() && txDate.getFullYear() === now.getFullYear();
            }
          }

          return searchMatch && accountMatch && partnerMatch && typeMatch && dateMatch;
        }).sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [transactions, searchQuery, selectedAccountFilter, selectedPartnerFilter, selectedTypeFilter, dateFilter]);

      // Category breakdown
      const categoryBreakdown = useMemo(() => {
        const incomeCats = {};
        const expenseCats = {};
        transactions.forEach((tx) => {
          const amt = toIQD(tx.amount, tx.currency);
          if (tx.type === 'income') {
            incomeCats[tx.category] = (incomeCats[tx.category] || 0) + amt;
          } else if (tx.type === 'expense') {
            expenseCats[tx.category] = (expenseCats[tx.category] || 0) + amt;
          }
        });
        return { incomeCats, expenseCats };
      }, [transactions, exchangeRate]);

      // Action Handlers
      const handleSaveTransaction = (e) => {
        e.preventDefault();
        if (!txForm.amount || Number(txForm.amount) <= 0) return;

        const newTx = {
          id: editingTx ? editingTx.id : `TX-${Date.now().toString().slice(-5)}`,
          refNumber: txForm.refNumber.trim() || `REF-${Math.floor(1000 + Math.random() * 9000)}`,
          type: txForm.type,
          amount: Number(txForm.amount),
          currency: txForm.currency,
          accountId: txForm.accountId,
          toAccountId: txForm.type === 'transfer' ? txForm.toAccountId : null,
          partner: txForm.partner,
          category: txForm.category,
          notes: txForm.notes.trim() || (lang === 'ku' ? 'هیچ تێبینییەک نەنووسراوە' : 'No memo provided.'),
          date: txForm.date
        };

        if (editingTx) {
          setTransactions((prev) => prev.map((t) => (t.id === editingTx.id ? newTx : t)));
          triggerToast(lang === 'ku' ? 'تۆمارەکە نوێکرایەوە' : 'Transaction updated!');
        } else {
          setTransactions((prev) => [newTx, ...prev]);
          triggerToast(lang === 'ku' ? 'جووڵەی دارایی نوێ تۆمارکرا' : 'Transaction logged!');
        }
        closeTxModal();
      };

      const handleSaveTransfer = (e) => {
        e.preventDefault();
        if (!transferForm.amount || Number(transferForm.amount) <= 0) return;
        if (transferForm.fromAccountId === transferForm.toAccountId) {
          triggerToast(lang === 'ku' ? 'هەژماری سەرچاوە و مەبەست دەبێت جیاواز بن' : 'Accounts must be different.');
          return;
        }

        const newTx = {
          id: `TX-${Date.now().toString().slice(-5)}`,
          refNumber: `TR-${Math.floor(1000 + Math.random() * 9000)}`,
          type: 'transfer',
          amount: Number(transferForm.amount),
          currency: transferForm.currency,
          accountId: transferForm.fromAccountId,
          toAccountId: transferForm.toAccountId,
          partner: transferForm.partner,
          category: 'Internal Account Rebalance',
          notes: transferForm.notes.trim() || (lang === 'ku' ? 'گواستنەوەی نێوان هەژمارەکان' : 'Internal liquidity transfer.'),
          date: transferForm.date
        };

        setTransactions((prev) => [newTx, ...prev]);
        setIsTransferModalOpen(false);
        triggerToast(lang === 'ku' 
          ? `پارە گوازرایەوە لە ${ACCOUNTS[newTx.accountId].shortNameKu} بۆ ${ACCOUNTS[newTx.toAccountId].shortNameKu}` 
          : `Transferred from ${ACCOUNTS[newTx.accountId].shortName} to ${ACCOUNTS[newTx.toAccountId].shortName}!`);
      };

      const openNewTxModal = (type = 'income', partner = 'Sarwar', category = null) => {
        setEditingTx(null);
        setTxForm({
          type,
          amount: '',
          currency: 'IQD',
          accountId: 'fib',
          toAccountId: 'cash',
          partner: partner || 'Sarwar',
          category: category || ((TRANSACTION_CATEGORIES[type] && TRANSACTION_CATEGORIES[type][0]) || 'General'),
          refNumber: '',
          notes: '',
          date: new Date().toISOString().slice(0, 16)
        });
        setIsTxModalOpen(true);
      };

      const openEditTxModal = (tx) => {
        setEditingTx(tx);
        setTxForm({
          type: tx.type,
          amount: tx.amount,
          currency: tx.currency || 'IQD',
          accountId: tx.accountId,
          toAccountId: tx.toAccountId || 'cash',
          partner: tx.partner,
          category: tx.category,
          refNumber: tx.refNumber || '',
          notes: tx.notes,
          date: tx.date
        });
        setIsTxModalOpen(true);
      };

      const closeTxModal = () => {
        setIsTxModalOpen(false);
        setEditingTx(null);
      };

      const handleDeleteTx = (id) => {
        setConfirmDialog({
          title: t.deleteModalTitle,
          message: t.deleteModalMessage,
          confirmLabel: t.deleteConfirm,
          confirmColor: 'bg-rose-600 hover:bg-rose-700',
          onConfirm: () => {
            setTransactions((prev) => prev.filter((t) => t.id !== id));
            triggerToast(lang === 'ku' ? 'تۆمارەکە سڕایەوە' : 'Transaction removed.');
            setConfirmDialog(null);
          }
        });
      };

      // Wipe only transactions (keeps opening balances intact)
      const handleClearAllTransactions = () => {
        setConfirmDialog({
          title: lang === 'ku' ? 'سڕینەوەی هەموو جووڵە داراییەکان' : 'Clear All Transaction Records',
          message: lang === 'ku' 
            ? 'ئایا دڵنیایت لە سڕینەوەی هەموو تۆمارەکان؟ هەموو داهات، خەرجی و گواستنەوەکان دەسڕێنەوە، بەڵام باڵانسی سەرەتایی هەژمارەکان وەک خۆی دەمێنێتەوە.' 
            : 'Are you sure you want to clear all transaction records? Opening balances will be preserved.',
          confirmLabel: lang === 'ku' ? 'بەڵێ، هەمووی بسڕەوە' : 'Yes, Wipe Records',
          confirmColor: 'bg-rose-600 hover:bg-rose-700',
          onConfirm: () => {
            setTransactions([]);
            localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify([]));
            triggerToast(lang === 'ku' ? 'تەواوی جووڵە داراییەکان سڕانەوە' : 'All transactions wiped.');
            setConfirmDialog(null);
          }
        });
      };

      // Full system reset: zero out opening balances + zero out transactions
      const handleResetEverything = () => {
        setConfirmDialog({
          title: lang === 'ku' ? 'سفرکردنەوەی تەواوەتی سیستەم' : 'Full System Factory Reset',
          message: lang === 'ku' 
            ? 'ئاگاداربە! ئەم کردارە هەموو باڵانسی سەرەتایی هەژمارەکان دەکاتە ٠ و هەموو تۆمارەکانیش بە تەواوی دەسڕێتەوە. هیچ داتایەک ناگەڕێتەوە.' 
            : 'Warning! This will zero out all opening account balances and delete all logged transactions. This cannot be undone.',

                        value={transferForm.fromAccountId}
                        onChange={(e) => setTransferForm({ ...transferForm, fromAccountId: e.target.value })}
                        className="w-full p-2 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl"
                      >
                        {Object.values(ACCOUNTS).map(acc => (
                          <option key={acc.id} value={acc.id}>{getAccountName(acc)}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">{t.destAccount}</label>
                      <select
                        value={transferForm.toAccountId}
                        onChange={(e) => setTransferForm({ ...transferForm, toAccountId: e.target.value })}
                        className="w-full p-2 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl"
                      >
                        {Object.values(ACCOUNTS)
                          .filter(a => a.id !== transferForm.fromAccountId)
                          .map(acc => (
                            <option key={acc.id} value={acc.id}>{getAccountName(acc)}</option>
                          ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">{t.authorizingPartner}</label>
                    <select
                      value={transferForm.partner}
                      onChange={(e) => setTransferForm({ ...transferForm, partner: e.target.value })}
                      className="w-full p-2 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl"
                    >
                      {PARTNERS.map(p => (
                        <option key={p} value={p}>{getPartnerName(p)}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">{t.transferNote}</label>
                    <input
                      type="text"
                      value={transferForm.notes}
                      onChange={(e) => setTransferForm({ ...transferForm, notes: e.target.value })}
                      className="w-full p-2 text-xs bg-slate-50 border border-slate-200 rounded-xl"
                    />
                  </div>

                  <div className="pt-3 border-t border-slate-100 flex gap-2">
                    <button
                      type="button"
                      onClick={() => setIsTransferModalOpen(false)}
                      className="flex-1 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 rounded-xl"
                    >
                      {t.cancel}
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-md"
                    >
                      {t.executeTransfer}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: SETTLEMENT SIMULATOR */}
          {isSettlementModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 overflow-y-auto">
              <div className="relative w-full max-w-xl rounded-3xl bg-white border border-slate-200 shadow-2xl p-6 space-y-6">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div className="flex items-center gap-2">
                    <Icon name="calculator" className="w-5 h-5 text-purple-600" />
                    <h3 className="text-base font-black text-slate-900">{t.settlementTitle}</h3>
                  </div>
                  <button onClick={() => setIsSettlementModalOpen(false)} className="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-500">
                    <Icon name="x" className="w-3.5 h-3.5" />
                  </button>
                </div>

                <div className="space-y-6">
                  {/* Slider */}
                  <div className="p-4 rounded-2xl bg-purple-50/60 border border-purple-200 space-y-3">
                    <div className="flex items-center justify-between text-xs font-bold text-purple-950">
                      <span>{getPartnerName('Sarwar')}: {equityRatio.Sarwar}%</span>
                      <span>{getPartnerName('Wazham')}: {equityRatio.Wazham}%</span>
                    </div>
                    <input
                      type="range"
                      min="0"
                      max="100"
                      step="5"
                      value={equityRatio.Sarwar}
                      onChange={(e) => {
                        const sarwarVal = Number(e.target.value);
                        setEquityRatio({ Sarwar: sarwarVal, Wazham: 100 - sarwarVal });
                      }}
                      className="w-full accent-purple-600 cursor-pointer"
                    />
                    <p className="text-[11px] text-purple-700">{t.settlementSub}</p>
                  </div>

                  {/* Settlement Calculation Table */}
                  <div className="border border-slate-200 rounded-2xl overflow-hidden text-xs">
                    <table className={`w-full ${isRtl ? 'text-right' : 'text-left'}`}>
                      <thead className="bg-slate-50 font-bold text-slate-500">
                        <tr>
                          <th className="p-3">{t.colPartner}</th>
                          <th className="p-3">{t.entitledShare}</th>
                          <th className="p-3">{t.totalWithdrawn}</th>
                          <th className="p-3">Partner Loan:</th>
                          <th className={`p-3 ${isRtl ? 'text-left' : 'text-right'}`}>{t.netLiquidationOwed}</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 font-medium">
                        <tr>
                          <td className="p-3 font-bold text-slate-800">{getPartnerName('Sarwar')} ({equityRatio.Sarwar}%)</td>
                          <td className="p-3">{formatIQD(partnerSettlement.sarwarEntitled)}</td>
                          <td className="p-3 text-amber-600">-{formatIQD(partnerSettlement.sarwarWithdrawn)}</td>
                          <td className="p-3 text-rose-600 font-bold">-{formatIQD(partnerSettlement.sarwarLoan)}</td>
                          <td className={`p-3 ${isRtl ? 'text-left' : 'text-right'} font-black text-indigo-600`}>
                            {formatIQD(partnerSettlement.sarwarNetDue)}
                          </td>
                        </tr>
                        <tr>
                          <td className="p-3 font-bold text-slate-800">{getPartnerName('Wazham')} ({equityRatio.Wazham}%)</td>
                          <td className="p-3">{formatIQD(partnerSettlement.wazhamEntitled)}</td>
                          <td className="p-3 text-amber-600">-{formatIQD(partnerSettlement.wazhamWithdrawn)}</td>
                          <td className="p-3 text-rose-600 font-bold">-{formatIQD(partnerSettlement.wazhamLoan)}</td>
                          <td className={`p-3 ${isRtl ? 'text-left' : 'text-right'} font-black text-purple-600`}>
                            {formatIQD(partnerSettlement.wazhamNetDue)}
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  <div className="flex justify-end">
                    <button
                      onClick={() => setIsSettlementModalOpen(false)}
                      className="px-5 py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl"
                    >
                      {t.closeSimulator}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-16 border-t border-slate-200 py-6 text-center text-xs text-slate-400">
            <p>{t.footerText}</p>
          </footer>
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
