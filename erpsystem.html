    function App() {
      // Language State
      const [lang, setLang] = useState(() => {
        return localStorage.getItem('ordercenter_lang') || 'ku';
      });

      const t = TRANSLATIONS[lang];
      const isRtl = lang === 'ku';

      // Switch language & document direction
      const toggleLanguage = () => {
        const nextLang = lang === 'en' ? 'ku' : 'en';
        setLang(nextLang);
        localStorage.setItem('ordercenter_lang', nextLang);
        document.documentElement.dir = nextLang === 'ku' ? 'rtl' : 'ltr';
        document.documentElement.lang = nextLang;
      };

      useEffect(() => {
        document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;
      }, [lang, isRtl]);

      // Transactions Store (Fresh, clean start)
      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('ordercenter_erp_v1_txs');
        if (!saved) return [];
        try {
          const parsed = JSON.parse(saved);
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      });

      // Opening Starting Balances for all 5 accounts (Stored in localStorage)
      const [openingBalances, setOpeningBalances] = useState(() => {
        const saved = localStorage.getItem('ordercenter_opening_balances');
        if (saved) {
          try {
            return JSON.parse(saved);
          } catch (e) {}
        }
        return { fib: 0, cihan: 0, qi: 0, hyperpost: 0, cash: 0 };
      });

      // Editable Opening Balances temporary form state for Settings Tab
      const [openingForm, setOpeningForm] = useState(openingBalances);

      // USD Exchange Rate
      const [exchangeRate, setExchangeRate] = useState(() => {
        const saved = localStorage.getItem('ordercenter_usd_rate');
        return saved ? Number(saved) : 1500;
      });

      // Current active tab: 'dashboard' | 'transactions' | 'partners' | 'analytics' | 'settings'
      const [activeTab, setActiveTab] = useState('dashboard');

      // Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedAccountFilter, setSelectedAccountFilter] = useState('all');
      const [selectedPartnerFilter, setSelectedPartnerFilter] = useState('all');
      const [selectedTypeFilter, setSelectedTypeFilter] = useState('all');
      const [dateFilter, setDateFilter] = useState('all');

      // Modals
      const [isTxModalOpen, setIsTxModalOpen] = useState(false);
      const [isTransferModalOpen, setIsTransferModalOpen] = useState(false);
      const [isSettlementModalOpen, setIsSettlementModalOpen] = useState(false);
      const [editingTx, setEditingTx] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const [confirmDialog, setConfirmDialog] = useState(null);

      // Form States
      const [txForm, setTxForm] = useState({
        type: 'income',
        amount: '',
        currency: 'IQD',
        accountId: 'fib',
        toAccountId: 'cash',
        partner: 'Sarwar',
        category: TRANSACTION_CATEGORIES.income[0],
        refNumber: '',
        notes: '',
        date: new Date().toISOString().slice(0, 16)
      });

      const [transferForm, setTransferForm] = useState({
        amount: '',
        currency: 'IQD',
        fromAccountId: 'cash',
        toAccountId: 'cihan',
        partner: 'Sarwar',
        notes: 'Account balance rebalancing',
        date: new Date().toISOString().slice(0, 16)
      });

      const [equityRatio, setEquityRatio] = useState({ Sarwar: 50, Wazham: 50 });

      // Save transactions to localStorage
      useEffect(() => {
        localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify(transactions));
      }, [transactions]);

      // Save opening balances to localStorage
      useEffect(() => {
        localStorage.setItem('ordercenter_opening_balances', JSON.stringify(openingBalances));
        setOpeningForm(openingBalances);
      }, [openingBalances]);

      // Save USD rate to localStorage
      useEffect(() => {
        localStorage.setItem('ordercenter_usd_rate', exchangeRate.toString());
      }, [exchangeRate]);

      // Toast Notification
      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      // Currency Helpers
      const toIQD = (amount, currency) => {
        const val = Number(amount) || 0;
        return currency === 'USD' ? val * exchangeRate : val;
      };

      const formatIQD = (val) => {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'IQD',
          maximumFractionDigits: 0
        }).format(val || 0).replace('IQD', lang === 'ku' ? 'د.ع' : 'IQD');
      };

      const formatUSD = (val) => {
        const usd = (val || 0) / (exchangeRate || 1500);
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          maximumFractionDigits: 2
        }).format(usd);
      };

      // Calculate Net Balances for all 5 accounts (Opening Balance + Transactions)
      const accountBalances = useMemo(() => {
        const balances = { 
          fib: Number(openingBalances.fib) || 0, 
          cihan: Number(openingBalances.cihan) || 0, 
          qi: Number(openingBalances.qi) || 0, 
          hyperpost: Number(openingBalances.hyperpost) || 0, 
          cash: Number(openingBalances.cash) || 0 
        };

        transactions.forEach((tx) => {
          const amtIQD = toIQD(tx.amount, tx.currency);
          if (tx.type === 'income') {
            balances[tx.accountId] = (balances[tx.accountId] || 0) + amtIQD;
          } else if (tx.type === 'expense' || tx.type === 'withdrawal') {
            balances[tx.accountId] = (balances[tx.accountId] || 0) - amtIQD;
          } else if (tx.type === 'transfer') {
            balances[tx.accountId] = (balances[tx.accountId] || 0) - amtIQD;
            if (tx.toAccountId) {
              balances[tx.toAccountId] = (balances[tx.toAccountId] || 0) + amtIQD;
            }
          }
        });
        return balances;
      }, [transactions, openingBalances, exchangeRate]);

      // Total Liquidity
      const totalConsolidatedLiquidity = useMemo(() => {
        return Object.values(accountBalances).reduce((acc, curr) => acc + curr, 0);
      }, [accountBalances]);

      // Metrics & Analytics
      const metrics = useMemo(() => {
        let totalRevenue = 0;
        let totalExpenses = 0;
        let partnerWithdrawals = { Sarwar: 0, Wazham: 0 };

        transactions.forEach((tx) => {
          const amtIQD = toIQD(tx.amount, tx.currency);
          if (tx.type === 'income') {
            totalRevenue += amtIQD;
          } else if (tx.type === 'expense') {
            totalExpenses += amtIQD;
          } else if (tx.type === 'withdrawal') {
            if (partnerWithdrawals[tx.partner] !== undefined) {
              partnerWithdrawals[tx.partner] += amtIQD;
            }
          }
        });

        const netProfit = totalRevenue - totalExpenses;
        const netRetained = netProfit - (partnerWithdrawals.Sarwar + partnerWithdrawals.Wazham);

        return {
          totalRevenue,
          totalExpenses,
          netProfit,
          netRetained,
          partnerWithdrawals
        };
      }, [transactions, exchangeRate]);

      // Filtered Transactions
      const filteredTransactions = useMemo(() => {
        return transactions.filter((tx) => {
          const searchMatch = 
            (tx.notes || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (tx.category || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (tx.refNumber && tx.refNumber.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (tx.amount || '').toString().includes(searchQuery);

          const accountMatch = 
            selectedAccountFilter === 'all' || 
            tx.accountId === selectedAccountFilter || 
            tx.toAccountId === selectedAccountFilter;

          const partnerMatch = 
            selectedPartnerFilter === 'all' || 
            tx.partner === selectedPartnerFilter;

          const typeMatch = 
            selectedTypeFilter === 'all' || 
            tx.type === selectedTypeFilter;

          let dateMatch = true;
          if (dateFilter !== 'all') {
            const txDate = new Date(tx.date);
            const now = new Date();
            if (dateFilter === 'today') {
              dateMatch = txDate.toDateString() === now.toDateString();
            } else if (dateFilter === 'week') {
              const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
              dateMatch = txDate >= weekAgo;
            } else if (dateFilter === 'month') {
              dateMatch = txDate.getMonth() === now.getMonth() && txDate.getFullYear() === now.getFullYear();
            }
          }

          return searchMatch && accountMatch && partnerMatch && typeMatch && dateMatch;
        }).sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [transactions, searchQuery, selectedAccountFilter, selectedPartnerFilter, selectedTypeFilter, dateFilter]);

      // Category breakdown
      const categoryBreakdown = useMemo(() => {
        const incomeCats = {};
        const expenseCats = {};
        transactions.forEach((tx) => {
          const amt = toIQD(tx.amount, tx.currency);
          if (tx.type === 'income') {
            incomeCats[tx.category] = (incomeCats[tx.category] || 0) + amt;
          } else if (tx.type === 'expense') {
            expenseCats[tx.category] = (expenseCats[tx.category] || 0) + amt;
          }
        });
        return { incomeCats, expenseCats };
      }, [transactions, exchangeRate]);

      // Action Handlers
      const handleSaveTransaction = (e) => {
        e.preventDefault();
        if (!txForm.amount || Number(txForm.amount) <= 0) return;

        const newTx = {
          id: editingTx ? editingTx.id : `TX-${Date.now().toString().slice(-5)}`,
          refNumber: txForm.refNumber.trim() || `REF-${Math.floor(1000 + Math.random() * 9000)}`,
          type: txForm.type,
          amount: Number(txForm.amount),
          currency: txForm.currency,
          accountId: txForm.accountId,
          toAccountId: txForm.type === 'transfer' ? txForm.toAccountId : null,
          partner: txForm.partner,
          category: txForm.category,
          notes: txForm.notes.trim() || (lang === 'ku' ? 'هیچ تێبینییەک نەنووسراوە' : 'No memo provided.'),
          date: txForm.date
        };

        if (editingTx) {
          setTransactions((prev) => prev.map((t) => (t.id === editingTx.id ? newTx : t)));
          triggerToast(lang === 'ku' ? 'تۆمارەکە نوێکرایەوە' : 'Transaction updated!');
        } else {
          setTransactions((prev) => [newTx, ...prev]);
          triggerToast(lang === 'ku' ? 'جووڵەی دارایی نوێ تۆمارکرا' : 'Transaction logged!');
        }
        closeTxModal();
      };

      const handleSaveTransfer = (e) => {
        e.preventDefault();
        if (!transferForm.amount || Number(transferForm.amount) <= 0) return;
        if (transferForm.fromAccountId === transferForm.toAccountId) {
          triggerToast(lang === 'ku' ? 'هەژماری سەرچاوە و مەبەست دەبێت جیاواز بن' : 'Accounts must be different.');
          return;
        }

        const newTx = {
          id: `TX-${Date.now().toString().slice(-5)}`,
          refNumber: `TR-${Math.floor(1000 + Math.random() * 9000)}`,
          type: 'transfer',
          amount: Number(transferForm.amount),
          currency: transferForm.currency,
          accountId: transferForm.fromAccountId,
          toAccountId: transferForm.toAccountId,
          partner: transferForm.partner,
          category: 'Internal Account Rebalance',
          notes: transferForm.notes.trim() || (lang === 'ku' ? 'گواستنەوەی نێوان هەژمارەکان' : 'Internal liquidity transfer.'),
          date: transferForm.date
        };

        setTransactions((prev) => [newTx, ...prev]);
        setIsTransferModalOpen(false);
        triggerToast(lang === 'ku' 
          ? `پارە گوازرایەوە لە ${ACCOUNTS[newTx.accountId].shortNameKu} بۆ ${ACCOUNTS[newTx.toAccountId].shortNameKu}` 
          : `Transferred from ${ACCOUNTS[newTx.accountId].shortName} to ${ACCOUNTS[newTx.toAccountId].shortName}!`);
      };

      const openNewTxModal = (type = 'income') => {
        setEditingTx(null);
        setTxForm({
          type,
          amount: '',
          currency: 'IQD',
          accountId: 'fib',
          toAccountId: 'cash',
          partner: 'Sarwar',
          category: (TRANSACTION_CATEGORIES[type] && TRANSACTION_CATEGORIES[type][0]) || 'General',
          refNumber: '',
          notes: '',
          date: new Date().toISOString().slice(0, 16)
        });
        setIsTxModalOpen(true);
      };

      const openEditTxModal = (tx) => {
        setEditingTx(tx);
        setTxForm({
          type: tx.type,
          amount: tx.amount,
          currency: tx.currency || 'IQD',
          accountId: tx.accountId,
          toAccountId: tx.toAccountId || 'cash',
          partner: tx.partner,
          category: tx.category,
          refNumber: tx.refNumber || '',
          notes: tx.notes,
          date: tx.date
        });
        setIsTxModalOpen(true);
      };

      const closeTxModal = () => {
        setIsTxModalOpen(false);
        setEditingTx(null);
      };

      const handleDeleteTx = (id) => {
        setConfirmDialog({
          title: t.deleteModalTitle,
          message: t.deleteModalMessage,
          confirmLabel: t.deleteConfirm,
          confirmColor: 'bg-rose-600 hover:bg-rose-700',
          onConfirm: () => {
            setTransactions((prev) => prev.filter((t) => t.id !== id));
            triggerToast(lang === 'ku' ? 'تۆمارەکە سڕایەوە' : 'Transaction removed.');
            setConfirmDialog(null);
          }
        });
      };

      // Wipe only transactions (keeps opening balances intact)
      const handleClearAllTransactions = () => {
        setConfirmDialog({
          title: lang === 'ku' ? 'سڕینەوەی هەموو جووڵە داراییەکان' : 'Clear All Transaction Records',
          message: lang === 'ku' 
            ? 'ئایا دڵنیایت لە سڕینەوەی هەموو تۆمارەکان؟ هەموو داهات، خەرجی و گواستنەوەکان دەسڕێنەوە، بەڵام باڵانسی سەرەتایی هەژمارەکان وەک خۆی دەمێنێتەوە.' 
            : 'Are you sure you want to clear all transaction records? Opening balances will be preserved.',
          confirmLabel: lang === 'ku' ? 'بەڵێ، هەمووی بسڕەوە' : 'Yes, Wipe Records',
          confirmColor: 'bg-rose-600 hover:bg-rose-700',
          onConfirm: () => {
            setTransactions([]);
            localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify([]));
            triggerToast(lang === 'ku' ? 'تەواوی جووڵە داراییەکان سڕانەوە' : 'All transactions wiped.');
            setConfirmDialog(null);
          }
        });
      };

      // Full system reset: zero out opening balances + zero out transactions
      const handleResetEverything = () => {
        setConfirmDialog({
          title: lang === 'ku' ? 'سفرکردنەوەی تەواوەتی سیستەم' : 'Full System Factory Reset',
          message: lang === 'ku' 
            ? 'ئاگاداربە! ئەم کردارە هەموو باڵانسی سەرەتایی هەژمارەکان دەکاتە ٠ و هەموو تۆمارەکانیش بە تەواوی دەسڕێتەوە. هیچ داتایەک ناگەڕێتەوە.' 
            : 'Warning! This will zero out all opening account balances and delete all logged transactions. This cannot be undone.',
          confirmLabel: lang === 'ku' ? 'سفرکردنەوەی گشتی' : 'Reset Everything to 0',
          confirmColor: 'bg-red-700 hover:bg-red-800',
          onConfirm: () => {
            setTransactions([]);
            const zeros = { fib: 0, cihan: 0, qi: 0, hyperpost: 0, cash: 0 };
            setOpeningBalances(zeros);
            setOpeningForm(zeros);
            localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify([]));
            localStorage.setItem('ordercenter_opening_balances', JSON.stringify(zeros));
            triggerToast(lang === 'ku' ? 'سیستەمەکە بە تەواوی سفر کرایەوە' : 'System reset to zero.');
            setConfirmDialog(null);
          }
        });
      };

      // Save Opening Balances from Settings Tab
      const handleSaveOpeningBalances = (e) => {
        e.preventDefault();
        const updated = {
          fib: Math.max(0, Number(openingForm.fib) || 0),
          cihan: Math.max(0, Number(openingForm.cihan) || 0),
          qi: Math.max(0, Number(openingForm.qi) || 0),
          hyperpost: Math.max(0, Number(openingForm.hyperpost) || 0),
          cash: Math.max(0, Number(openingForm.cash) || 0)
        };
        setOpeningBalances(updated);
        triggerToast(lang === 'ku' ? 'باڵانسی سەرەتایی هەژمارەکان پاشەکەوت کرا' : 'Opening balances saved successfully!');
      };

      const exportCSV = () => {
        const headers = ['Ref #', 'Date & Time', 'Type', 'Amount', 'Currency', 'Amount (IQD)', 'Source Account', 'Destination Account', 'Partner / User', 'Category', 'Notes'];
        const rows = filteredTransactions.map((tx) => [
          tx.refNumber || tx.id,
          tx.date.replace('T', ' '),
          tx.type.toUpperCase(),
          tx.amount,
          tx.currency,
          toIQD(tx.amount, tx.currency),
          ACCOUNTS[tx.accountId]?.name || tx.accountId,
          tx.toAccountId ? ACCOUNTS[tx.toAccountId]?.name : 'N/A',
          tx.partner,
          `"${tx.category}"`,
          `"${tx.notes.replace(/"/g, '""')}"`
        ]);

        const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `OrderCenter_ERP_Ledger_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        triggerToast(lang === 'ku' ? 'فایلی CSV دابەزی' : 'Ledger exported to CSV.');
      };

      const partnerSettlement = useMemo(() => {
        const netProf = metrics.netProfit;
        const sarwarShareRatio = equityRatio.Sarwar / 100;
        const wazhamShareRatio = equityRatio.Wazham / 100;

        const sarwarEntitled = netProf * sarwarShareRatio;
        const wazhamEntitled = netProf * wazhamShareRatio;

        const sarwarWithdrawn = metrics.partnerWithdrawals.Sarwar;
        const wazhamWithdrawn = metrics.partnerWithdrawals.Wazham;

        const sarwarNetDue = sarwarEntitled - sarwarWithdrawn;
        const wazhamNetDue = wazhamEntitled - wazhamWithdrawn;

        return {
          sarwarEntitled,
          wazhamEntitled,
          sarwarWithdrawn,
          wazhamWithdrawn,
          sarwarNetDue,
          wazhamNetDue
        };
      }, [metrics, equityRatio]);

      // Helper for Account Name based on language
      const getAccountName = (acc) => (lang === 'ku' ? acc.nameKu : acc.name);
      const getAccountShortName = (acc) => (lang === 'ku' ? acc.shortNameKu : acc.shortName);
      const getPartnerName = (p) => (p === 'Sarwar' ? (lang === 'ku' ? 'سەروەر' : 'Sarwar') : (lang === 'ku' ? 'واژام' : 'Wazham'));

      return (
        <div className={`min-h-screen ${isRtl ? 'font-nrt' : ''}`}>
          
          {/* ===================== DEDICATED A4 PRINT STATEMENT (VISIBLE ONLY ON PRINT) ===================== */}
          <section className="print-only-statement p-2">
            {/* Header / Letterhead */}
            <div className="flex items-start justify-between pb-4 border-b-2 border-slate-900 mb-4">
              <div>
                <h1 className="text-2xl font-black text-slate-950 uppercase tracking-tight">Order Center</h1>
                <p className="text-sm font-bold text-slate-700 mt-0.5">
                  {lang === 'ku' ? 'ڕاپۆرتی فەرمی دارایی و خەزێنە' : 'Official Treasury & Financial Statement'}
                </p>
                <p className="text-xs text-slate-500">
                  {lang === 'ku' ? 'بەرواری دەرکردن:' : 'Generated Date:'} {new Date().toLocaleString(lang === 'ku' ? 'ckb-IQ' : 'en-US')}
                </p>
              </div>
              <div className={isRtl ? 'text-left' : 'text-right'}>
                <span className="text-xs uppercase font-extrabold px-2.5 py-1 bg-slate-100 border border-slate-300 rounded text-slate-800">
                  A4 Executive Audit
                </span>
                <p className="text-xs text-slate-600 mt-2">
                  {lang === 'ku' ? 'پشکی هاوبەشەکان: سەروەر (٥٠٪) • واژام (٥٠٪)' : 'Partners: Sarwar (50%) • Wazham (50%)'}
                </p>
              </div>
            </div>

            {/* Financial Snapshot Summary Cards */}
            <div className="grid grid-cols-4 gap-3 mb-5 print-card">
              <div className="p-3 border border-slate-300 rounded-lg bg-slate-50">
                <span className="text-[10px] font-bold text-slate-500 uppercase">{t.totalLiquidity}</span>
                <div className="text-base font-black text-slate-900 mt-0.5">{formatIQD(totalConsolidatedLiquidity)}</div>
                <div className="text-[10px] text-slate-500 font-semibold">≈ {formatUSD(totalConsolidatedLiquidity)}</div>
              </div>
              <div className="p-3 border border-slate-300 rounded-lg bg-slate-50">
                <span className="text-[10px] font-bold text-slate-500 uppercase">{t.totalRevenue}</span>
                <div className="text-base font-black text-emerald-700 mt-0.5">+{formatIQD(metrics.totalRevenue)}</div>
              </div>
              <div className="p-3 border border-slate-300 rounded-lg bg-slate-50">
                <span className="text-[10px] font-bold text-slate-500 uppercase">{t.totalExpenses}</span>
                <div className="text-base font-black text-rose-700 mt-0.5">-{formatIQD(metrics.totalExpenses)}</div>
              </div>
              <div className="p-3 border border-slate-300 rounded-lg bg-slate-50">
                <span className="text-[10px] font-bold text-slate-500 uppercase">{t.netProfit}</span>
                <div className="text-base font-black text-indigo-900 mt-0.5">{formatIQD(metrics.netProfit)}</div>
              </div>
            </div>

            {/* 5 Accounts Balance Breakdown */}
            <div className="mb-5 border border-slate-300 rounded-lg p-3 print-card bg-white">
              <h4 className="text-xs font-black uppercase text-slate-700 mb-2">
                {lang === 'ku' ? 'دابەشبوونی نەختینە بەسەر ٥ هەژمارەکەدا' : '5 Account Liquidity Distribution'}
              </h4>
              <div className="grid grid-cols-5 gap-2 text-center">
                {Object.values(ACCOUNTS).map((acc) => (
                  <div key={acc.id} className="p-2 border border-slate-200 rounded bg-slate-50">
                    <span className="text-[10px] font-bold text-slate-600 block">{getAccountShortName(acc)}</span>
                    <span className="text-xs font-black text-slate-900 mt-0.5 block">{formatIQD(accountBalances[acc.id] || 0)}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Filter Scope Note */}
            <div className="mb-2 text-xs font-bold text-slate-600 flex items-center justify-between">
              <span>
                {lang === 'ku' ? 'تۆماری جووڵە داراییەکان (تۆمارە فلتەرکراوەکان):' : 'General Ledger Records (Filtered Scope):'} {filteredTransactions.length} {lang === 'ku' ? 'جووڵە' : 'records'}
              </span>
              <span>{t.exchangeRateNote} {exchangeRate} IQD</span>
            </div>

            {/* Ledger Table for Print */}
            <table className="w-full text-xs text-slate-900 border border-slate-300">
              <thead>
                <tr className="bg-slate-200 text-slate-800 text-[10px] uppercase font-black text-start">
                  <th className="p-2 border-b border-slate-400">#</th>
                  <th className="p-2 border-b border-slate-400">{t.colRefDate}</th>
                  <th className="p-2 border-b border-slate-400">{t.colType}</th>
                  <th className="p-2 border-b border-slate-400">{t.colAccountFlow}</th>
                  <th className="p-2 border-b border-slate-400">{t.colCategory}</th>
                  <th className="p-2 border-b border-slate-400">{t.colPartner}</th>
                  <th className="p-2 border-b border-slate-400">{t.colNotes}</th>
                  <th className={`p-2 border-b border-slate-400 ${isRtl ? 'text-left' : 'text-right'}`}>{t.colAmount}</th>
                </tr>
              </thead>
              <tbody>
                {filteredTransactions.map((tx, idx) => {
                  const amtIQD = toIQD(tx.amount, tx.currency);
                  const fromAcc = ACCOUNTS[tx.accountId];
                  const toAcc = tx.toAccountId ? ACCOUNTS[tx.toAccountId] : null;

                  return (
                    <tr key={tx.id} className="border-b border-slate-200">
                      <td className="p-1.5 text-slate-500 font-mono text-[10px]">{idx + 1}</td>
                      <td className="p-1.5 font-mono text-[10px]">
                        <strong>{tx.refNumber || tx.id}</strong>
                        <div className="text-slate-500">{new Date(tx.date).toLocaleDateString()}</div>

                  <div className="border-b border-slate-100 pb-4">
                    <h3 className="text-base font-black text-slate-900 flex items-center gap-2">
                      <Icon name="wallet" className="w-5 h-5 text-indigo-600" />
                      <span>{t.openingBalancesTitle}</span>
                    </h3>
                    <p className="text-xs text-slate-500 mt-1">{t.openingBalancesDesc}</p>
                  </div>

                  <form onSubmit={handleSaveOpeningBalances} className="space-y-5">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      {Object.values(ACCOUNTS).map((acc) => (
                        <div key={acc.id} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-1.5">
                          <label className="text-xs font-bold text-slate-700 flex items-center justify-between">
                            <span className="flex items-center gap-1.5">
                              <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: acc.colorHex }}></span>
                              {getAccountName(acc)}
                            </span>
                            <span className="text-[11px] font-mono text-slate-400">IQD</span>
                          </label>
                          <input
                            type="number"
                            min="0"
                            placeholder="0"
                            value={openingForm[acc.id] || ''}
                            onChange={(e) => setOpeningForm({ ...openingForm, [acc.id]: e.target.value })}
                            className="w-full p-2.5 bg-white border border-slate-300 rounded-xl font-black text-base text-slate-900 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                          />
                          <p className="text-[10px] text-slate-400">
                            ≈ {formatUSD(Number(openingForm[acc.id]) || 0)}
                          </p>
                        </div>
                      ))}

                      {/* USD Exchange Rate Setting */}
                      <div className="p-4 rounded-2xl bg-indigo-50/60 border border-indigo-200 space-y-1.5 sm:col-span-2">
                        <label className="text-xs font-bold text-indigo-950 flex items-center justify-between">
                          <span className="flex items-center gap-1.5">
                            <Icon name="dollar-sign" className="w-4 h-4 text-indigo-600" />
                            {t.usdRateLabel}
                          </span>
                        </label>
                        <div className="flex gap-2">
                          <input
                            type="number"
                            min="100"
                            value={exchangeRate}
                            onChange={(e) => setExchangeRate(Number(e.target.value) || 1500)}
                            className="w-full p-2.5 bg-white border border-indigo-300 rounded-xl font-black text-base text-indigo-950 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                          />
                        </div>
                        <p className="text-[11px] text-indigo-700">
                          {lang === 'ku' ? 'ئەم نرخە بۆ گۆڕینی دۆلار بۆ دینار لە سەرجەم ئەپەکەدا بەکاردێت.' : 'This rate is used across the system for currency conversions.'}
                        </p>
                      </div>
                    </div>

                    <div className="pt-2 flex justify-end">
                      <button
                        type="submit"
                        className="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center gap-2"
                      >
                        <Icon name="check" className="w-4 h-4" />
                        <span>{t.saveSettings}</span>
                      </button>
                    </div>
                  </form>
                </div>

                {/* Danger Zone: Wipe / Reset Data */}
                <div className="p-6 sm:p-8 rounded-3xl bg-rose-50/60 border border-rose-200 shadow-sm space-y-4">
                  <div className="flex items-center gap-2.5">
                    <div className="p-2.5 rounded-xl bg-rose-100 text-rose-700">
                      <Icon name="alert-triangle" className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="text-base font-black text-rose-950">{t.dangerZone}</h3>
                      <p className="text-xs text-rose-700 mt-0.5">{t.dangerZoneDesc}</p>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-3">
                    <div className="p-4 rounded-2xl bg-white border border-rose-200 space-y-2 flex flex-col justify-between">
                      <div>
                        <h4 className="text-sm font-bold text-slate-900">{t.clearAllTxBtn}</h4>
                        <p className="text-xs text-slate-500 mt-0.5">
                          {lang === 'ku' ? 'تەواوی جووڵە داراییەکان دەسڕێتەوە، بەڵام سەرمایەی سەرەتا و باڵانسی ٥ هەژمارەکە دەهێڵێتەوە.' : 'Deletes transaction records while preserving your starting balances.'}
                        </p>
                      </div>
                      <button
                        onClick={handleClearAllTransactions}
                        className="mt-3 w-full py-2.5 px-4 bg-rose-100 hover:bg-rose-200 text-rose-800 font-bold text-xs rounded-xl transition flex items-center justify-center gap-1.5"
                      >
                        <Icon name="trash-2" className="w-4 h-4" />
                        <span>{t.clearAllTxBtn}</span>
                      </button>
                    </div>

                    <div className="p-4 rounded-2xl bg-white border border-rose-300 space-y-2 flex flex-col justify-between">
                      <div>
                        <h4 className="text-sm font-bold text-rose-950">{t.resetEverythingBtn}</h4>
                        <p className="text-xs text-rose-700 mt-0.5">
                          {lang === 'ku' ? 'هەموو شتێک بە تەواوی سفر دەکرێتەوە و دەگەڕێتەوە بۆ دۆخی سەرەتا (پاکتاوی ١٠٠٪).' : 'Zeros out all 5 account balances and clears the entire ledger completely.'}
                        </p>
                      </div>
                      <button
                        onClick={handleResetEverything}
                        className="mt-3 w-full py-2.5 px-4 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl shadow transition flex items-center justify-center gap-1.5"
                      >
                        <Icon name="alert-circle" className="w-4 h-4" />
                        <span>{t.resetEverythingBtn}</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* MODAL: TRANSACTION */}
          {isTxModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 overflow-y-auto">
              <div className="relative w-full max-w-lg rounded-3xl bg-white border border-slate-200 shadow-2xl overflow-hidden my-8">
                <div className="p-6 border-b border-slate-100 flex items-center justify-between">
                  <div>
                    <h3 className="text-lg font-black text-slate-900">
                      {editingTx ? t.recordModalTitleEdit : t.recordModalTitleNew}
                    </h3>
                    <p className="text-xs text-slate-400 mt-0.5">{t.recordModalSub}</p>
                  </div>
                  <button onClick={closeTxModal} className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handleSaveTransaction} className="p-6 space-y-4">
                  {/* Type buttons */}
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1.5">{t.txClassification}</label>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                      {[
                        { id: 'income', label: t.typeIncome, icon: 'arrow-down-left', color: 'text-emerald-500' },
                        { id: 'expense', label: t.typeExpense, icon: 'arrow-up-right', color: 'text-rose-500' },
                        { id: 'transfer', label: t.typeTransfer, icon: 'arrow-left-right', color: 'text-blue-500' },
                        { id: 'withdrawal', label: t.typeWithdrawal, icon: 'user-check', color: 'text-amber-500' }
                      ].map((tItem) => {
                        const isSelected = txForm.type === tItem.id;
                        return (
                          <button
                            type="button"
                            key={tItem.id}
                            onClick={() => {
                              setTxForm({ 
                                ...txForm, 
                                type: tItem.id, 
                                category: TRANSACTION_CATEGORIES[tItem.id][0] || 'General' 
                              });
                            }}
                            className={`flex flex-col items-center gap-1 p-2 rounded-xl border text-xs font-bold transition ${
                              isSelected
                                ? 'bg-indigo-600 text-white border-indigo-600 shadow-md'
                                : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-slate-300'
                            }`}
                          >
                            <Icon name={tItem.icon} className={`w-4 h-4 ${isSelected ? 'text-white' : tItem.color}`} />
                            <span>{tItem.label}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Amount & Currency */}
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">{t.amountCurrency}</label>
                    <div className="flex gap-2">
                      <input
                        type="number"
                        min="1"
                        required
                        placeholder="e.g. 500000"
                        value={txForm.amount}
                        onChange={(e) => setTxForm({ ...txForm, amount: e.target.value })}
                        className="w-full p-2.5 text-base font-bold bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                      />
                      <select
                        value={txForm.currency}
                        onChange={(e) => setTxForm({ ...txForm, currency: e.target.value })}
                        className="p-2.5 font-bold text-xs bg-slate-100 border border-slate-200 rounded-xl text-slate-800"
                      >
                        <option value="IQD">{lang === 'ku' ? 'دینار (د.ع)' : 'IQD'}</option>
                        <option value="USD">{lang === 'ku' ? 'دۆلار ($)' : 'USD'}</option>
                      </select>
                    </div>
                  </div>

                  {/* Accounts */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">
                        {txForm.type === 'transfer' ? t.sourceAccount : t.accountTarget}
                      </label>
                      <select
                        value={txForm.accountId}
                        onChange={(e) => setTxForm({ ...txForm, accountId: e.target.value })}
                        className="w-full p-2.5 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl"
                      >
                        {Object.values(ACCOUNTS).map((acc) => (
                          <option key={acc.id} value={acc.id}>{getAccountName(acc)}</option>
                        ))}
                      </select>
                    </div>

                    {txForm.type === 'transfer' ? (
                      <div>
                        <label className="block text-xs font-bold text-slate-600 mb-1">{t.destAccount}</label>
                        <select
                          value={txForm.toAccountId}
                          onChange={(e) => setTxForm({ ...txForm, toAccountId: e.target.value })}
                          className="w-full p-2.5 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl"
                        >
                          {Object.values(ACCOUNTS)
                            .filter(a => a.id !== txForm.accountId)
                            .map((acc) => (
                              <option key={acc.id} value={acc.id}>{getAccountName(acc)}</option>
                            ))}
                        </select>
                      </div>
                    ) : (
                      <div>
                        <label className="block text-xs font-bold text-slate-600 mb-1">{t.associatedPartner}</label>
                        <select
                          value={txForm.partner}
                          onChange={(e) => setTxForm({ ...txForm, partner: e.target.value })}
                          className="w-full p-2.5 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl"
                        >
                          {PARTNERS.map((p) => (
                            <option key={p} value={p}>{getPartnerName(p)}</option>
                          ))}
                        </select>
                      </div>
                    )}
                  </div>

                  {/* Category & Ref # */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">{t.accountingCategory}</label>
                      <select
                        value={txForm.category}
                        onChange={(e) => setTxForm({ ...txForm, category: e.target.value })}
                        className="w-full p-2.5 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl"
                      >
                        {(TRANSACTION_CATEGORIES[txForm.type] || []).map((cat) => (
                          <option key={cat} value={cat}>{cat}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">{t.refInvoiceNum}</label>
                      <input
                        type="text"
                        placeholder="e.g. ORD-9821"
                        value={txForm.refNumber}
                        onChange={(e) => setTxForm({ ...txForm, refNumber: e.target.value })}
                        className="w-full p-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl"
                      />
                    </div>
                  </div>

                  {/* Notes */}
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">{t.reasonMemo}</label>
                    <textarea
                      rows="3"
                      required
                      placeholder={t.memoPlaceholder}
                      value={txForm.notes}
                      onChange={(e) => setTxForm({ ...txForm, notes: e.target.value })}
                      className="w-full p-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl resize-none"
                    />
                  </div>

                  {/* Date */}
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">{t.dateTimeMovement}</label>
                    <input
                      type="datetime-local"
                      value={txForm.date}
                      onChange={(e) => setTxForm({ ...txForm, date: e.target.value })}
                      className="w-full p-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl"
                    />
                  </div>

                  {/* Buttons */}
                  <div className="pt-4 border-t border-slate-100 flex items-center gap-3">
                    <button
                      type="button"
                      onClick={closeTxModal}
                      className="flex-1 py-2.5 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl"
                    >
                      {t.cancel}
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-lg shadow-indigo-600/30"
                    >
                      {editingTx ? t.updateEntry : t.postToLedger}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: TRANSFER */}
          {isTransferModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 overflow-y-auto">
              <div className="relative w-full max-w-md rounded-3xl bg-white border border-slate-200 shadow-2xl p-6 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div>
                    <h3 className="text-base font-black text-slate-900">{t.quickTransferTitle}</h3>
                    <p className="text-xs text-slate-400 mt-0.5">{t.quickTransferSub}</p>
                  </div>
                  <button onClick={() => setIsTransferModalOpen(false)} className="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-500">
                    <Icon name="x" className="w-3.5 h-3.5" />
                  </button>
                </div>

                <form onSubmit={handleSaveTransfer} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">{t.transferAmount}</label>
                    <div className="flex gap-2">
                      <input
                        type="number"
                        min="1"
                        required
                        placeholder="e.g. 1000000"
                        value={transferForm.amount}
                        onChange={(e) => setTransferForm({ ...transferForm, amount: e.target.value })}
                        className="w-full p-2.5 text-sm font-bold bg-slate-50 border border-slate-200 rounded-xl"
                      />
                      <select
                        value={transferForm.currency}
                        onChange={(e) => setTransferForm({ ...transferForm, currency: e.target.value })}
                        className="p-2.5 text-xs font-bold bg-slate-100 border border-slate-200 rounded-xl"
                      >
                        <option value="IQD">IQD</option>
                        <option value="USD">USD</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">{t.sourceAccount}</label>
                      <select
                        value={transferForm.fromAccountId}
                        onChange={(e) => setTransferForm({ ...transferForm, fromAccountId: e.target.value })}
                        className="w-full p-2 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl"
                      >
                        {Object.values(ACCOUNTS).map(acc => (
                          <option key={acc.id} value={acc.id}>{getAccountName(acc)}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">{t.destAccount}</label>
                      <select
                        value={transferForm.toAccountId}
                        onChange={(e) => setTransferForm({ ...transferForm, toAccountId: e.target.value })}
                        className="w-full p-2 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl"
                      >
                        {Object.values(ACCOUNTS)
                          .filter(a => a.id !== transferForm.fromAccountId)
                          .map(acc => (
                            <option key={acc.id} value={acc.id}>{getAccountName(acc)}</option>
                          ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">{t.authorizingPartner}</label>
                    <select
                      value={transferForm.partner}
                      onChange={(e) => setTransferForm({ ...transferForm, partner: e.target.value })}
                      className="w-full p-2 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl"
                    >
                      {PARTNERS.map(p => (
                        <option key={p} value={p}>{getPartnerName(p)}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">{t.transferNote}</label>
                    <input
                      type="text"
                      value={transferForm.notes}
                      onChange={(e) => setTransferForm({ ...transferForm, notes: e.target.value })}
                      className="w-full p-2 text-xs bg-slate-50 border border-slate-200 rounded-xl"
                    />
                  </div>

                  <div className="pt-3 border-t border-slate-100 flex gap-2">
                    <button
                      type="button"
                      onClick={() => setIsTransferModalOpen(false)}
                      className="flex-1 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 rounded-xl"
                    >
                      {t.cancel}
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-md"
                    >
                      {t.executeTransfer}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: SETTLEMENT SIMULATOR */}
          {isSettlementModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 overflow-y-auto">
              <div className="relative w-full max-w-xl rounded-3xl bg-white border border-slate-200 shadow-2xl p-6 space-y-6">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div className="flex items-center gap-2">
                    <Icon name="calculator" className="w-5 h-5 text-purple-600" />
                    <h3 className="text-base font-black text-slate-900">{t.settlementTitle}</h3>
                  </div>
                  <button onClick={() => setIsSettlementModalOpen(false)} className="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-500">
                    <Icon name="x" className="w-3.5 h-3.5" />
                  </button>
                </div>

                <div className="space-y-6">
                  {/* Slider */}
                  <div className="p-4 rounded-2xl bg-purple-50/60 border border-purple-200 space-y-3">
                    <div className="flex items-center justify-between text-xs font-bold text-purple-950">
                      <span>{getPartnerName('Sarwar')}: {equityRatio.Sarwar}%</span>
                      <span>{getPartnerName('Wazham')}: {equityRatio.Wazham}%</span>
                    </div>
                    <input
                      type="range"
                      min="0"
                      max="100"
                      step="5"
                      value={equityRatio.Sarwar}
                      onChange={(e) => {
                        const sarwarVal = Number(e.target.value);
                        setEquityRatio({ Sarwar: sarwarVal, Wazham: 100 - sarwarVal });
                      }}
                      className="w-full accent-purple-600 cursor-pointer"
                    />
                    <p className="text-[11px] text-purple-700">{t.settlementSub}</p>
                  </div>

                  {/* Settlement Calculation Table */}
                  <div className="border border-slate-200 rounded-2xl overflow-hidden text-xs">
                    <table className={`w-full ${isRtl ? 'text-right' : 'text-left'}`}>
                      <thead className="bg-slate-50 font-bold text-slate-500">
                        <tr>
                          <th className="p-3">{t.colPartner}</th>
                          <th className="p-3">{t.entitledShare}</th>
                          <th className="p-3">{t.totalWithdrawn}</th>
                          <th className={`p-3 ${isRtl ? 'text-left' : 'text-right'}`}>{t.netLiquidationOwed}</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 font-medium">
                        <tr>
                          <td className="p-3 font-bold text-slate-800">{getPartnerName('Sarwar')} ({equityRatio.Sarwar}%)</td>
                          <td className="p-3">{formatIQD(partnerSettlement.sarwarEntitled)}</td>
                          <td className="p-3 text-amber-600">-{formatIQD(partnerSettlement.sarwarWithdrawn)}</td>
                          <td className={`p-3 ${isRtl ? 'text-left' : 'text-right'} font-black text-indigo-600`}>
                            {formatIQD(partnerSettlement.sarwarNetDue)}
                          </td>
                        </tr>
                        <tr>
                          <td className="p-3 font-bold text-slate-800">{getPartnerName('Wazham')} ({equityRatio.Wazham}%)</td>
                          <td className="p-3">{formatIQD(partnerSettlement.wazhamEntitled)}</td>
                          <td className="p-3 text-amber-600">-{formatIQD(partnerSettlement.wazhamWithdrawn)}</td>
                          <td className={`p-3 ${isRtl ? 'text-left' : 'text-right'} font-black text-purple-600`}>
                            {formatIQD(partnerSettlement.wazhamNetDue)}
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  <div className="flex justify-end">
                    <button
                      onClick={() => setIsSettlementModalOpen(false)}
                      className="px-5 py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl"
                    >
                      {t.closeSimulator}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-16 border-t border-slate-200 py-6 text-center text-xs text-slate-400">
            <p>{t.footerText}</p>
          </footer>
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
