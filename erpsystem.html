    const TRANSACTION_CATEGORIES = DEFAULT_CATEGORIES;

    
    
    // ==========================================
    // REST API CLIENT (CONNECTS TO NODE.JS & SQLITE)
    // ==========================================
    const isNodeBackend = window.location.protocol.startsWith('http');
    
    const api = {
      getToken: () => localStorage.getItem('ordercenter_token'),
      setToken: (t) => localStorage.setItem('ordercenter_token', t),
      clearToken: () => localStorage.removeItem('ordercenter_token'),
      
      headers: () => ({
        'Content-Type': 'application/json',
        ...(localStorage.getItem('ordercenter_token') ? { 'Authorization': `Bearer ${localStorage.getItem('ordercenter_token')}` } : {})
      }),

      async login(username, password) {
        if (!isNodeBackend) {
          // Fallback if opened directly via file://
          const savedUsers = JSON.parse(localStorage.getItem('ordercenter_users') || '[]');
          const user = savedUsers.find(u => u.username.toLowerCase() === username.trim().toLowerCase());
          if (!user) throw new Error('Account not found.');
          if (!user.active) throw new Error('Account is suspended.');
          const passwords = JSON.parse(localStorage.getItem('ordercenter_passwords') || '{}');
          if (password !== (passwords[user.username] || 'admin123')) throw new Error('Incorrect password.');
          return { token: 'mock_token', user };
        }
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        this.setToken(data.token);
        return data;
      },

      async getMe() {
        if (!isNodeBackend) return JSON.parse(localStorage.getItem('ordercenter_session') || 'null');
        const token = this.getToken();
        if (!token) return null;
        try {
          const res = await fetch('/api/auth/me', { headers: this.headers() });
          if (!res.ok) { this.clearToken(); return null; }
          const data = await res.json();
          return data.user;
        } catch (e) {
          return null;
        }
      },

      async logout() {
        if (isNodeBackend) {
          await fetch('/api/auth/logout', { method: 'POST', headers: this.headers() }).catch(() => {});
        }
        this.clearToken();
      },

      async getTransactions() {
        if (!isNodeBackend) return JSON.parse(localStorage.getItem('ordercenter_erp_v1_txs') || '[]');
        const res = await fetch('/api/transactions', { headers: this.headers() });
        const data = await res.json();
        return data.transactions || [];
      },

      async createTransaction(tx) {
        if (!isNodeBackend) {
          const txs = JSON.parse(localStorage.getItem('ordercenter_erp_v1_txs') || '[]');
          const newTx = { ...tx, id: 'tx_' + Date.now(), createdAt: new Date().toISOString() };
          localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify([newTx, ...txs]));
          return newTx;
        }
        const res = await fetch('/api/transactions', {
          method: 'POST',
          headers: this.headers(),
          body: JSON.stringify(tx)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to create transaction');
        return data.transaction;
      },

      async updateTransaction(id, tx) {
        if (!isNodeBackend) {
          const txs = JSON.parse(localStorage.getItem('ordercenter_erp_v1_txs') || '[]');
          const updated = txs.map(t => t.id === id ? { ...t, ...tx } : t);
          localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify(updated));
          return tx;
        }
        const res = await fetch(`/api/transactions/${id}`, {
          method: 'PUT',
          headers: this.headers(),
          body: JSON.stringify(tx)
        });
        const data = await res.json();
        return data.transaction;
      },

      async deleteTransaction(id) {
        if (!isNodeBackend) {
          const txs = JSON.parse(localStorage.getItem('ordercenter_erp_v1_txs') || '[]');
          localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify(txs.filter(t => t.id !== id)));
          return true;
        }
        await fetch(`/api/transactions/${id}`, { method: 'DELETE', headers: this.headers() });
        return true;
      },

      async clearAllTransactions() {
        if (!isNodeBackend) {
          localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify([]));
          return true;
        }
        await fetch('/api/transactions/clear-all', { method: 'POST', headers: this.headers() });
        return true;
      },

      async getBalances() {
        if (!isNodeBackend) return JSON.parse(localStorage.getItem('ordercenter_opening_balances') || '{"fib":0,"cihan":0,"qi":0,"hyperpost":0,"cash":0}');
        const res = await fetch('/api/balances', { headers: this.headers() });
        const data = await res.json();
        return data.balances;
      },

      async setBalances(balances) {
        if (!isNodeBackend) {
          localStorage.setItem('ordercenter_opening_balances', JSON.stringify(balances));
          return balances;
        }

        const data = await res.json();
        return data.balances;

      async getUsers() {
        if (!isNodeBackend) return JSON.parse(localStorage.getItem('ordercenter_users') || '[]');
        const res = await fetch('/api/users', { headers: this.headers() });
        if (!res.ok) return [];
        const data = await res.json();
        return data.users || [];
      },

      async createUser(userData) {
        if (!isNodeBackend) {
          const users = JSON.parse(localStorage.getItem('ordercenter_users') || '[]');
          const newUser = { id: 'usr_' + Date.now(), ...userData, role: 'user', active: 1, createdAt: new Date().toISOString().split('T')[0] };
          users.push(newUser);
          localStorage.setItem('ordercenter_users', JSON.stringify(users));
          return newUser;
        }
        const res = await fetch('/api/users', {
          method: 'POST',
          headers: this.headers(),
          body: JSON.stringify(userData)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to create user');
        return data.user;
      },

      async toggleUserStatus(id, active) {
        if (!isNodeBackend) {
          const users = JSON.parse(localStorage.getItem('ordercenter_users') || '[]');
          const updated = users.map(u => u.id === id ? { ...u, active: active ? 1 : 0 } : u);
          localStorage.setItem('ordercenter_users', JSON.stringify(updated));
          return true;
        }
        await fetch(`/api/users/${id}/status`, {
          method: 'PATCH',
          headers: this.headers(),
          body: JSON.stringify({ active })
        });
        return true;
      },

      async resetPassword(userId, newPassword) {
        if (!isNodeBackend) return true;
        const res = await fetch(`/api/users/${userId}/password`, {
          method: 'PUT',
          headers: this.headers(),
          body: JSON.stringify({ newPassword })
        });
        if (!res.ok) {
          const d = await res.json();
          throw new Error(d.error || 'Failed to reset password');
        }
        return true;
      },

      async deleteUser(id) {
        if (!isNodeBackend) {
          const users = JSON.parse(localStorage.getItem('ordercenter_users') || '[]');
          localStorage.setItem('ordercenter_users', JSON.stringify(users.filter(u => u.id !== id)));
          return true;
        }
        await fetch(`/api/users/${id}`, { method: 'DELETE', headers: this.headers() });
        return true;
      }
    };

                <Icon name="shield" className="w-8 h-8" />
              </div>
              <h1 className="text-3xl font-black text-white tracking-tight">Order Center</h1>
              <p className="text-xs font-bold tracking-widest text-slate-300 uppercase mt-1">
                Global Shopping & Shipping
              </p>
              <div className="inline-flex items-center gap-1.5 mt-3 px-3 py-1 rounded-full bg-white/10 border border-white/10 text-white/90 text-xs font-semibold backdrop-blur-md">

                <h2 className="text-xl font-black text-slate-900">Sign In</h2>
                <p className="text-xs text-slate-500 mt-1">Enter your credentials to access the financial portal</p>
              </div>

              {error && (

                api.getTransactions(),
                api.getBalances()
              ]);
              if (serverTxs && Array.isArray(serverTxs) && serverTxs.length > 0) {
                const sanitized = serverTxs.map(tx => {
                  const rate = Number(tx.exchangeRate) || 1500;
                  const amtIQD = tx.amountIQD !== undefined && tx.amountIQD !== null
                    ? Number(tx.amountIQD)
                    : (tx.currency === 'USD' ? (Number(tx.amount) * rate) : Number(tx.amount));
                  return { ...tx, exchangeRate: rate, amountIQD: amtIQD };

                setTransactions(sanitized);
                localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify(sanitized));
              }
              if (serverBalances) {
                setOpeningBalances(serverBalances);
                localStorage.setItem('ordercenter_opening_balances', JSON.stringify(serverBalances));
              }

              if (me.role === 'admin') {
                const serverUsers = await api.getUsers();
                if (serverUsers && serverUsers.length > 0) setUsers(serverUsers);
              }

      // Filters

      // Modals
      const [isTxModalOpen, setIsTxModalOpen] = useState(false);

      const [isSettlementModalOpen, setIsSettlementModalOpen] = useState(false);

      const [isDeleteAllModalOpen, setIsDeleteAllModalOpen] = useState(false);
      const [deleteAllStep, setDeleteAllStep] = useState(1);

      // Dynamic Transaction Categories with persistence

      // Auto-generate sequential, unchangeable Order Invoice number
      const generateNextInvoiceNumber = (txList = transactions) => {
        let highestNum = 1000;
        (txList || []).forEach(tx => {
          const ref = tx.refNumber || tx.id || '';
          const match = ref.match(/ORD-(\d+)/i);
          if (match && match[1]) {
            const n = parseInt(match[1], 10);
            if (!isNaN(n) && n > highestNum) {
              highestNum = n;
            }
          }
        });
        if (highestNum === 1000 && (txList || []).length > 0) {
          highestNum = 1000 + (txList || []).length;
        }
        return `ORD-${highestNum + 1}`;
      };

      const handleAddCategory = (type, name) => {
        const trimmed = (name || '').trim();

          setCategoryManagerError(lang === 'ku' ? 'تکایە ناوی جۆرەکە بنووسە' : 'Please enter a category name');
          return;
        }
        const currentList = categories[type] || [];
        if (currentList.some(c => c.toLowerCase() === trimmed.toLowerCase())) {
          setCategoryManagerError(lang === 'ku' ? 'ئەم جۆرە پێشتر بوونی هەیە' : 'This category already exists');
          return;
        }
        const updatedList = [...currentList, trimmed];
        setCategories(prev => ({
          ...prev,
          [type]: updatedList
        }));
        setTxForm(prev => ({ ...prev, category: trimmed }));
        setNewCategoryName('');
        setCategoryManagerError('');
        triggerToast(lang === 'ku' ? `جۆری نوێ زیادکرا: ${trimmed}` : `Category added: ${trimmed}`);
      };

      const handleDeleteCategory = (type, categoryToDelete) => {
        const currentList = categories[type] || [];
        if (currentList.length <= 1) {
          triggerToast(lang === 'ku' ? 'ناتوانیت هەموو جۆرەکان بسڕیتەوە' : 'Cannot delete the last remaining category');
          return;
        }
        const updatedList = currentList.filter(c => c !== categoryToDelete);
        setCategories(prev => ({
          ...prev,
          [type]: updatedList
        }));
        if (txForm.category === categoryToDelete) {

        }
        triggerToast(lang === 'ku' ? `جۆرەکە سڕایەوە: ${categoryToDelete}` : `Category deleted: ${categoryToDelete}`);
      };

      // Form States
      const [txForm, setTxForm] = useState({

      });

      const [equityRatio, setEquityRatio] = useState({ Sarwar: 50, Wazham: 50 });

      // Loan Management State (with historical exchange rate locking)
      const [loans, setLoans] = useState(() => {
        const saved = localStorage.getItem('ordercenter_loans_v1');
        const defaultRate = Number(localStorage.getItem('ordercenter_usd_rate')) || 1500;
        if (!saved) return [];
        try {

          if (Array.isArray(parsed)) {

              exchangeRate: l.exchangeRate || defaultRate
            }));
          }

        } catch (e) {

      });

      useEffect(() => {

      const [isLoanModalOpen, setIsLoanModalOpen] = useState(false);
      const [editingLoan, setEditingLoan] = useState(null);
      const [viewingLoan, setViewingLoan] = useState(null);
      const [loanForm, setLoanForm] = useState({
        direction: 'borrowed', // 'borrowed' = Partner borrowed from someone | 'given' = Someone borrowed from partner
        partner: 'Sarwar',

      });

      const [loanFilter, setLoanFilter] = useState('all'); // 'all' | 'active'

      const openLoanModal = (partner = 'Sarwar', direction = 'borrowed') => {

        });

      // Save transactions to localStorage

      useEffect(() => {

        setOpeningForm(openingBalances);

      // Save USD rate to localStorage
      useEffect(() => {

      // Toast Notification
      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      // Currency Helpers
      // Currency Helpers (Strict historical locking: past records & loans NEVER recalculate or shift when global rate changes)
      const toIQD = (amountOrItem, currency, itemExchangeRate = null) => {
        if (typeof amountOrItem === 'object' && amountOrItem !== null) {
          const item = amountOrItem;
          const curr = item.currency || currency || 'IQD';
          const val = Number(item.amount !== undefined ? item.amount : (item.remainingAmount !== undefined ? item.remainingAmount : 0)) || 0;
          if (curr !== 'USD') {
            return val;
          }
          if (item.amountIQD !== undefined && item.amountIQD !== null) {
            return Number(item.amountIQD) || 0;
          }
          const lockedRate = Number(item.exchangeRate) || Number(itemExchangeRate) || 1500;
          return val * lockedRate;
        }

        const val = Number(amountOrItem) || 0;
        if (currency === 'USD') {
          const rate = Number(itemExchangeRate) || 1500;
          return val * rate;
        }
        return val;
      };

      const formatIQD = (val) => {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'IQD',
          maximumFractionDigits: 0
        }).format(val || 0).replace('IQD', lang === 'ku' ? 'د.ع' : 'IQD');
      };

      const formatUSD = (valIQD, customRate = null) => {
        const rate = Number(customRate) || exchangeRate || 1500;
        const usd = (Number(valIQD) || 0) / rate;
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          maximumFractionDigits: 2
        }).format(usd);
      };

      // Calculate Net Balances for all 5 accounts (Opening Balance + Transactions)
      const accountBalances = useMemo(() => {
        const balances = { 
          fib: Number(openingBalances.fib) || 0, 
          cihan: Number(openingBalances.cihan) || 0, 
          qi: Number(openingBalances.qi) || 0, 
          hyperpost: Number(openingBalances.hyperpost) || 0, 
          cash: Number(openingBalances.cash) || 0 
        };

        transactions.forEach((tx) => {
          const amtIQD = toIQD(tx);
          if (tx.type === 'income') {
            balances[tx.accountId] = (balances[tx.accountId] || 0) + amtIQD;
          } else if (tx.type === 'expense' || tx.type === 'withdrawal') {
            balances[tx.accountId] = (balances[tx.accountId] || 0) - amtIQD;
          } else if (tx.type === 'transfer') {
            balances[tx.accountId] = (balances[tx.accountId] || 0) - amtIQD;
            if (tx.toAccountId) {
              balances[tx.toAccountId] = (balances[tx.toAccountId] || 0) + amtIQD;
            }
          }
        });
        return balances;
      }, [transactions, openingBalances]);

      // Total Liquidity
      const totalConsolidatedLiquidity = useMemo(() => {
        return Object.values(accountBalances).reduce((acc, curr) => acc + curr, 0);
      }, [accountBalances]);

      // Metrics & Analytics
      const metrics = useMemo(() => {
        let totalRevenue = 0;
        let totalExpenses = 0;
        let partnerWithdrawals = { Sarwar: 0, Wazham: 0 };
        let partnerLoans = { Sarwar: 0, Wazham: 0 };

        transactions.forEach((tx) => {
          const amtIQD = toIQD(tx);
          const cat = (tx.category || '').toLowerCase();
          const isLoan = cat.includes('loan') || cat.includes('advance');

          if (tx.type === 'withdrawal') {
            if (isLoan) {
              if (partnerLoans[tx.partner] !== undefined) {
                partnerLoans[tx.partner] += amtIQD;
              }
            } else {
              if (partnerWithdrawals[tx.partner] !== undefined) {
                partnerWithdrawals[tx.partner] += amtIQD;
              }
            }
          } else if (tx.type === 'income' && isLoan) {
            if (partnerLoans[tx.partner] !== undefined) {
              partnerLoans[tx.partner] = Math.max(0, partnerLoans[tx.partner] - amtIQD);
            }
          } else if (tx.type === 'income') {
            totalRevenue += amtIQD;
          } else if (tx.type === 'expense') {
            totalExpenses += amtIQD;
          }
        });

        const loansFromState = { Sarwar: 0, Wazham: 0 };
        loans.forEach(l => {
          if (l.status === 'active' && loansFromState[l.partner] !== undefined) {
            loansFromState[l.partner] += toIQD({ ...l, amount: l.remainingAmount });
          }
        });

        const effectivePartnerLoans = {
          Sarwar: loans.length > 0 ? loansFromState.Sarwar : partnerLoans.Sarwar,
          Wazham: loans.length > 0 ? loansFromState.Wazham : partnerLoans.Wazham
        };

        const netProfit = totalRevenue - totalExpenses;
        const totalDrawings = partnerWithdrawals.Sarwar + partnerWithdrawals.Wazham;
        const totalLoans = effectivePartnerLoans.Sarwar + effectivePartnerLoans.Wazham;
        const netRetained = netProfit - totalDrawings - totalLoans;

        return {
          totalRevenue,
          totalExpenses,
          netProfit,
          netRetained,
          partnerWithdrawals,
          partnerLoans: effectivePartnerLoans
        };
      }, [transactions, loans]);

      // Filtered Transactions
      const filteredTransactions = useMemo(() => {
        return transactions.filter((tx) => {
          const searchMatch = 
            (tx.notes || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (tx.category || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (tx.refNumber && tx.refNumber.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (tx.amount || '').toString().includes(searchQuery);

          const accountMatch = 
            selectedAccountFilter === 'all' || 
            tx.accountId === selectedAccountFilter || 
            tx.toAccountId === selectedAccountFilter;

          const partnerMatch = 
            selectedPartnerFilter === 'all' || 
            tx.partner === selectedPartnerFilter;

          const typeMatch = 
            selectedTypeFilter === 'all' || 
            tx.type === selectedTypeFilter;

          let dateMatch = true;
          if (dateFilter !== 'all') {
            const txDate = new Date(tx.date);
            const now = new Date();
            if (dateFilter === 'today') {
              dateMatch = txDate.toDateString() === now.toDateString();
            } else if (dateFilter.startsWith('month-')) {
              const targetMonth = parseInt(dateFilter.split('-')[1], 10);
              dateMatch = txDate.getMonth() === targetMonth;
            } else if (dateFilter === 'week') {
              const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
              dateMatch = txDate >= weekAgo;
            } else if (dateFilter === 'month') {
              dateMatch = txDate.getMonth() === now.getMonth() && txDate.getFullYear() === now.getFullYear();
            }
          }

          return searchMatch && accountMatch && partnerMatch && typeMatch && dateMatch;
        }).sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [transactions, searchQuery, selectedAccountFilter, selectedPartnerFilter, selectedTypeFilter, dateFilter]);

      // Reset transaction page to 1 on filter or search changes
      useEffect(() => {
        setTxCurrentPage(1);
      }, [searchQuery, selectedAccountFilter, selectedPartnerFilter, selectedTypeFilter, dateFilter]);

      const totalTxPages = Math.max(1, Math.ceil(filteredTransactions.length / TXS_PER_PAGE));

      useEffect(() => {
        if (txCurrentPage > totalTxPages) {
          setTxCurrentPage(totalTxPages);
        }
      }, [totalTxPages, txCurrentPage]);

      const paginatedTransactions = useMemo(() => {
        const startIdx = (txCurrentPage - 1) * TXS_PER_PAGE;
        return filteredTransactions.slice(startIdx, startIdx + TXS_PER_PAGE);
      }, [filteredTransactions, txCurrentPage]);

      const txStartIndex = filteredTransactions.length === 0 ? 0 : (txCurrentPage - 1) * TXS_PER_PAGE + 1;
      const txEndIndex = Math.min(txCurrentPage * TXS_PER_PAGE, filteredTransactions.length);

      const getTxPageNumbers = () => {
        if (totalTxPages <= 7) {
          return Array.from({ length: totalTxPages }, (_, i) => i + 1);
        }
        const pages = [];
        if (txCurrentPage <= 4) {
          for (let i = 1; i <= 5; i++) pages.push(i);
          pages.push('...');
          pages.push(totalTxPages);
        } else if (txCurrentPage >= totalTxPages - 3) {
          pages.push(1);
          pages.push('...');
          for (let i = totalTxPages - 4; i <= totalTxPages; i++) pages.push(i);
        } else {
          pages.push(1);
          pages.push('...');
          for (let i = txCurrentPage - 1; i <= txCurrentPage + 1; i++) pages.push(i);
          pages.push('...');
          pages.push(totalTxPages);
        }
        return pages;
      };

      // Category breakdown
      const categoryBreakdown = useMemo(() => {
        const incomeCats = {};
        const expenseCats = {};
        transactions.forEach((tx) => {
          const amt = toIQD(tx);
          if (tx.type === 'income') {
            incomeCats[tx.category] = (incomeCats[tx.category] || 0) + amt;
          } else if (tx.type === 'expense') {
            expenseCats[tx.category] = (expenseCats[tx.category] || 0) + amt;
          }
        });
        return { incomeCats, expenseCats };
      }, [transactions]);

      // Action Handlers
      const handleSaveTransaction = (e) => {
        e.preventDefault();
        if (!txForm.amount || Number(txForm.amount) <= 0) return;

        const autoRef = txForm.refNumber || generateNextInvoiceNumber(transactions);
        const lockedRate = editingTx?.exchangeRate || exchangeRate;
        const newTx = {
          id: editingTx ? editingTx.id : `TX-${Date.now().toString().slice(-5)}`,
          refNumber: autoRef,
          type: txForm.type,
          amount: Number(txForm.amount),
          currency: txForm.currency,
          exchangeRate: lockedRate,
          amountIQD: txForm.currency === 'USD' ? Number(txForm.amount) * lockedRate : Number(txForm.amount),
          accountId: txForm.accountId,
          toAccountId: txForm.type === 'transfer' ? txForm.toAccountId : null,
          partner: txForm.partner,
          category: txForm.category,
          notes: txForm.notes.trim() || (lang === 'ku' ? 'هیچ تێبینییەک نەنووسراوە' : 'No memo provided.'),
          date: txForm.date
        };

        if (editingTx) {
          setTransactions((prev) => prev.map((t) => (t.id === editingTx.id ? newTx : t)));
          triggerToast(lang === 'ku' ? 'تۆمارەکە نوێکرایەوە' : 'Transaction updated!');
        } else {
          setTransactions((prev) => [newTx, ...prev]);
          triggerToast(lang === 'ku' ? 'جووڵەی دارایی نوێ تۆمارکرا' : 'Transaction logged!');
        }
        closeTxModal();
      };

      const handleSaveTransfer = (e) => {
        e.preventDefault();
        if (!transferForm.amount || Number(transferForm.amount) <= 0) return;
        if (transferForm.fromAccountId === transferForm.toAccountId) {
          triggerToast(lang === 'ku' ? 'هەژماری سەرچاوە و مەبەست دەبێت جیاواز بن' : 'Accounts must be different.');

        }

        const newTx = {
          id: `TX-${Date.now().toString().slice(-5)}`,
          refNumber: `TR-${Math.floor(1000 + Math.random() * 9000)}`,
          type: 'transfer',
          amount: Number(transferForm.amount),
          currency: transferForm.currency,
          exchangeRate: exchangeRate,
          amountIQD: transferForm.currency === 'USD' ? Number(transferForm.amount) * exchangeRate : Number(transferForm.amount),
          accountId: transferForm.fromAccountId,
          toAccountId: transferForm.toAccountId,

          accountId: 'fib',
          toAccountId: 'cash',
          partner: partner || 'Sarwar',
          category: category || ((categories[type] && categories[type][0]) || 'General'),
          refNumber: autoInvoice,
          notes: '',
          date: new Date().toISOString().slice(0, 16)
        });
        setIsTxModalOpen(true);
      };

      const openEditTxModal = (tx) => {
        if (!isAdmin) return;
        setEditingTx(tx);
        setCategoryManagerType(tx.type);
        setTxForm({
          type: tx.type,
          amount: tx.amount,
          currency: tx.currency || 'IQD',
          accountId: tx.accountId,
          toAccountId: tx.toAccountId || 'cash',
          partner: tx.partner,
          category: tx.category,
          refNumber: tx.refNumber || tx.id || generateNextInvoiceNumber(transactions),
          notes: tx.notes,
          date: tx.date
        });
        setIsTxModalOpen(true);
      };

      const closeTxModal = () => {
        setIsTxModalOpen(false);
        setEditingTx(null);
      };

      // Loan Action Handlers
      const handleSaveLoan = (e) => {
        e.preventDefault();
        const amt = Number(loanForm.amount);
        if (!amt || amt <= 0) return;
        const person = (loanForm.personName || '').trim();
        if (!person) {
          triggerToast(lang === 'ku' ? 'تکایە ناوی کەسەکە بنووسە' : 'Please enter person name');
          return;
        }

        const isBorrowed = loanForm.direction === 'borrowed';
        const txType = isBorrowed ? 'income' : 'withdrawal';
        const txCategory = isBorrowed ? 'Partner Loan (Borrowed)' : 'Partner Loan / Advance';
        const defaultMemo = isBorrowed
          ? (lang === 'ku' ? `قەرز وەرگیرا لەلایەن ${getPartnerName(loanForm.partner)} لە (${person})` : `Loan borrowed by ${loanForm.partner} from ${person}`)
          : (lang === 'ku' ? `قەرز درا بە (${person}) لەلایەن ${getPartnerName(loanForm.partner)}` : `Loan given to ${person} by ${loanForm.partner}`);

        if (editingLoan) {
          const diff = amt - editingLoan.amount;
          const newRemaining = Math.max(0, editingLoan.remainingAmount + diff);

          setLoans(prev => prev.map(l => {
            if (l.id === editingLoan.id) {
              return {
                ...l,
                direction: loanForm.direction,
                partner: loanForm.partner,
                personName: person,
                amount: amt,
                currency: loanForm.currency,
                accountId: loanForm.accountId,
                remainingAmount: newRemaining,
                status: newRemaining === 0 ? 'paid' : 'active',
                date: loanForm.date,
                notes: loanForm.notes.trim() || defaultMemo
              };
            }
            return l;
          }));

          if (editingLoan.txId) {
            setTransactions(prev => prev.map(tx => {
              if (tx.id === editingLoan.txId) {
                return {
                  ...tx,
                  type: txType,
                  amount: amt,
                  currency: loanForm.currency,
                  accountId: loanForm.accountId,
                  partner: loanForm.partner,
                  category: txCategory,
                  notes: loanForm.notes.trim() || defaultMemo,
                  date: loanForm.date
                };
              }
              return tx;
            }));
          }

          setEditingLoan(null);
          setIsLoanModalOpen(false);
          triggerToast(lang === 'ku' ? 'تۆماری قەرزەکە بە سەرکەوتوویی نوێکرایەوە' : 'Loan record updated successfully!');
          return;
        }

        const loanId = `LN-${Date.now().toString().slice(-5)}`;
        const invoiceNum = generateNextInvoiceNumber(transactions);
        const lockedRate = editingLoan?.exchangeRate || exchangeRate;

        const newTx = {
          id: `TX-${Date.now().toString().slice(-5)}`,
          refNumber: invoiceNum,
          type: txType,
          amount: amt,
          currency: loanForm.currency,
          exchangeRate: lockedRate,
          amountIQD: loanForm.currency === 'USD' ? amt * lockedRate : amt,
          accountId: loanForm.accountId,
          toAccountId: null,
          partner: loanForm.partner,
          category: txCategory,
          notes: loanForm.notes.trim() || defaultMemo,
          date: loanForm.date
        };

        const newLoan = {
          id: loanId,
          direction: loanForm.direction,
          partner: loanForm.partner,
          personName: person,
          amount: amt,
          currency: loanForm.currency,
          exchangeRate: lockedRate,
          accountId: loanForm.accountId,
          remainingAmount: amt,
          status: 'active',
          date: loanForm.date,
          notes: loanForm.notes.trim() || defaultMemo,
          txId: newTx.id
        };

        setLoans(prev => [newLoan, ...prev]);
        setTransactions(prev => [newTx, ...prev]);
        setIsLoanModalOpen(false);

        const accName = ACCOUNTS[loanForm.accountId]?.shortNameKu || ACCOUNTS[loanForm.accountId]?.shortName || loanForm.accountId;
        triggerToast(lang === 'ku' 
          ? `قەرزەکە بە سەرکەوتوویی تۆمارکرا (${isBorrowed ? 'زیادبوونی باڵانس +' : 'کەمبوونی باڵانس -'} لە ${accName})` 
          : `Loan logged successfully (${isBorrowed ? 'Balance increased +' : 'Balance deducted -'} in ${accName})!`);
      };

      const handleRepayLoan = (e) => {
        e.preventDefault();
        if (!repayingLoan) return;
        const repayAmt = Number(repayForm.amount);
        if (!repayAmt || repayAmt <= 0) return;
        if (repayAmt > repayingLoan.remainingAmount) {
          triggerToast(lang === 'ku' ? 'بڕی دانەوە ناتوانێت لە بڕی قەرز زیاتر بێت' : 'Repayment cannot exceed remaining loan balance.');
          return;
        }

        const invoiceNum = generateNextInvoiceNumber(transactions);
        const isBorrowed = repayingLoan.direction === 'borrowed';
        const lockedRate = repayingLoan.exchangeRate || exchangeRate;

        const txType = isBorrowed ? 'expense' : 'income';
        const txCategory = isBorrowed ? 'Partner Loan Repayment' : 'Client Fee Recovery';
        const defaultMemo = isBorrowed
          ? (lang === 'ku' ? `دانەوەی قەرزی وەرگیراو لە (${repayingLoan.personName}) لە ڕێگەی ${ACCOUNTS[repayForm.accountId]?.shortNameKu || repayForm.accountId}` : `Repayment of loan borrowed from ${repayingLoan.personName} via ${ACCOUNTS[repayForm.accountId]?.shortName || repayForm.accountId}`)
          : (lang === 'ku' ? `وەرگرتنەوەی قەرزی دراو بە (${repayingLoan.personName}) بۆ ${ACCOUNTS[repayForm.accountId]?.shortNameKu || repayForm.accountId}` : `Collection of loan given to ${repayingLoan.personName} into ${ACCOUNTS[repayForm.accountId]?.shortName || repayForm.accountId}`);

        const newTx = {
          id: `TX-${Date.now().toString().slice(-5)}`,
          refNumber: invoiceNum,
          type: txType,
          amount: repayAmt,
          currency: repayingLoan.currency,
          exchangeRate: lockedRate,
          amountIQD: repayingLoan.currency === 'USD' ? repayAmt * lockedRate : repayAmt,
          accountId: repayForm.accountId,
          toAccountId: null,
          partner: repayingLoan.partner,
          category: txCategory,
          notes: repayForm.notes.trim() || defaultMemo,
          date: repayForm.date
        };

        const newRemaining = Math.max(0, repayingLoan.remainingAmount - repayAmt);
        setLoans(prev => prev.map(l => {
          if (l.id === repayingLoan.id) {
            return {
              ...l,
              remainingAmount: newRemaining,
              status: newRemaining === 0 ? 'paid' : 'active'
            };
          }
          return l;
        }));

        setTransactions(prev => [newTx, ...prev]);
        setRepayingLoan(null);

        const accName = ACCOUNTS[repayForm.accountId]?.shortNameKu || ACCOUNTS[repayForm.accountId]?.shortName || repayForm.accountId;
        triggerToast(lang === 'ku'
          ? `دانەوەی قەرزەکە جێبەجێکرا (${isBorrowed ? 'کەمبوونی باڵانس -' : 'زیادبوونی باڵانس +'} لە ${accName})`
          : `Loan payment processed (${isBorrowed ? 'Balance deducted -' : 'Balance increased +'} in ${accName})!`);
      };

      const handleDeleteLoan = (loanId) => {
        if (!isAdmin) return;
        setConfirmDialog({
          title: lang === 'ku' ? 'سڕینەوەی تۆماری قەرز' : 'Delete Loan Record',
          message: lang === 'ku' 
            ? 'ئایا دڵنیایت لە سڕینەوەی ئەم تۆمارەی قەرز؟ ئەم کردارە پاشگەزبوونەوەی نییە.'
            : 'Are you sure you want to delete this loan record? This action cannot be undone.',
          confirmLabel: t.deleteConfirm,
          confirmColor: 'bg-rose-600 hover:bg-rose-700',
          onConfirm: () => {
            setLoans(prev => prev.filter(l => l.id !== loanId));
            triggerToast(lang === 'ku' ? 'تۆماری قەرزەکە سڕایەوە' : 'Loan record removed.');
            setConfirmDialog(null);
          }
        });
      };

      const handleDeleteTx = (id) => {
        if (!isAdmin) return;
        setConfirmDialog({
          title: t.deleteModalTitle,
          message: t.deleteModalMessage,
          confirmLabel: t.deleteConfirm,
          confirmColor: 'bg-rose-600 hover:bg-rose-700',
          onConfirm: () => {
            setTransactions((prev) => prev.filter((t) => t.id !== id));
            triggerToast(lang === 'ku' ? 'تۆمارەکە سڕایەوە' : 'Transaction removed.');
            setConfirmDialog(null);
          }
        });
      };

      // Wipe only transactions (keeps opening balances intact)
      const handleClearAllTransactions = () => {
        if (!isAdmin) return;
        setDeleteAllStep(1);
        setDeleteAllPassword('');
        setDeleteAllError('');
        setIsDeleteAllModalOpen(true);
      };

      // Full system reset: zero out opening balances + zero out transactions
      const handleResetEverything = () => {
        setConfirmDialog({
          title: lang === 'ku' ? 'سفرکردنەوەی تەواوەتی سیستەم' : 'Full System Factory Reset',
          message: lang === 'ku' 
            ? 'ئاگاداربە! ئەم کردارە هەموو باڵانسی سەرەتایی هەژمارەکان دەکاتە ٠ و هەموو تۆمارەکانیش بە تەواوی دەسڕێتەوە. هیچ داتایەک ناگەڕێتەوە.' 
            : 'Warning! This will zero out all opening account balances and delete all logged transactions. This cannot be undone.',
          confirmLabel: lang === 'ku' ? 'سفرکردنەوەی گشتی' : 'Reset Everything to 0',
          confirmColor: 'bg-red-700 hover:bg-red-800',
          onConfirm: () => {
            setTransactions([]);
            const zeros = { fib: 0, cihan: 0, qi: 0, hyperpost: 0, cash: 0 };
            setOpeningBalances(zeros);
            setOpeningForm(zeros);
            localStorage.setItem('ordercenter_erp_v1_txs', JSON.stringify([]));
            localStorage.setItem('ordercenter_opening_balances', JSON.stringify(zeros));
            triggerToast(lang === 'ku' ? 'سیستەمەکە بە تەواوی سفر کرایەوە' : 'System reset to zero.');
            setConfirmDialog(null);
          }
        });
      };

      // Save Opening Balances & Exchange Rate from Settings Tab
      const handleSaveOpeningBalances = async (e) => {
        e.preventDefault();
        const updatedBalances = {
          fib: Math.max(0, Number(openingForm.fib) || 0),
          cihan: Math.max(0, Number(openingForm.cihan) || 0),
          qi: Math.max(0, Number(openingForm.qi) || 0),
          hyperpost: Math.max(0, Number(openingForm.hyperpost) || 0),
          cash: Math.max(0, Number(openingForm.cash) || 0)
        };
        const newRate = Math.max(1, Number(exchangeRateForm) || 1500);

        setOpeningBalances(updatedBalances);
        setExchangeRate(newRate);
        localStorage.setItem('ordercenter_opening_balances', JSON.stringify(updatedBalances));
        localStorage.setItem('ordercenter_usd_rate', newRate.toString());

        if (typeof api !== 'undefined' && api.setBalances) {
          try {
            await api.setBalances(updatedBalances);
          } catch (err) {
            console.warn('Could not sync balances to server:', err);
          }
        }

        triggerToast(lang === 'ku' ? 'ڕێکخستنەکان و نرخی دۆلار پاشەکەوت کران (داتای پێشتر نەگۆڕاوە)' : 'Settings & USD Rate saved! Previous data remains locked.');
      };

      const exportCSV = () => {
        if (!isAdmin) return;
        const headers = ['Ref #', 'Date & Time', 'Type', 'Amount', 'Currency', 'Amount (IQD)', 'Source Account', 'Destination Account', 'Partner / User', 'Category', 'Notes'];
        const rows = filteredTransactions.map((tx) => [
          tx.refNumber || tx.id,
          tx.date.replace('T', ' '),
          tx.type.toUpperCase(),
          tx.amount,
          tx.currency,
          toIQD(tx),
          ACCOUNTS[tx.accountId]?.name || tx.accountId,
          tx.toAccountId ? ACCOUNTS[tx.toAccountId]?.name : 'N/A',
          tx.partner,
          `"${tx.category}"`,
          `"${tx.notes.replace(/"/g, '""')}"`
        ]);

        const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `OrderCenter_ERP_Ledger_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        triggerToast(lang === 'ku' ? 'فایلی CSV دابەزی' : 'Ledger exported to CSV.');
      };

      const partnerSettlement = useMemo(() => {
        const netProf = metrics.netProfit;
        const sarwarShareRatio = equityRatio.Sarwar / 100;
        const wazhamShareRatio = equityRatio.Wazham / 100;

        const sarwarEntitled = netProf * sarwarShareRatio;
        const wazhamEntitled = netProf * wazhamShareRatio;

        const sarwarWithdrawn = metrics.partnerWithdrawals.Sarwar;
        const wazhamWithdrawn = metrics.partnerWithdrawals.Wazham;

        const sarwarLoan = metrics.partnerLoans.Sarwar;
        const wazhamLoan = metrics.partnerLoans.Wazham;

        const sarwarNetDue = sarwarEntitled - sarwarWithdrawn - sarwarLoan;
        const wazhamNetDue = wazhamEntitled - wazhamWithdrawn - wazhamLoan;

        return {
          sarwarEntitled,
          wazhamEntitled,
          sarwarWithdrawn,
          wazhamWithdrawn,
          sarwarLoan,
          wazhamLoan,
          sarwarNetDue,
          wazhamNetDue
        };
      }, [metrics, equityRatio]);

      // Helper for Account Name based on language
      const getAccountName = (acc) => (lang === 'ku' ? acc.nameKu : acc.name);
      const getAccountShortName = (acc) => (lang === 'ku' ? acc.shortNameKu : acc.shortName);
      const getPartnerName = (p) => (p === 'Sarwar' ? (lang === 'ku' ? 'سەروەر' : 'Sarwar') : (lang === 'ku' ? 'واژام' : 'Wazham'));

      if (!currentUser) {
        return (
          <LoginScreen
            users={users}
            userPasswords={userPasswords}
            onLogin={(user) => {
              setCurrentUser(user);
              localStorage.setItem('ordercenter_session', JSON.stringify(user));
              triggerToast(`Welcome back, ${user.name}!`);
            }}
          />
        );
      }


      return (
        <div className={`min-h-screen ${isRtl ? 'font-nrt' : ''}`}>
          
          {/* ===================== DEDICATED A4 PRINT STATEMENT (VISIBLE ONLY ON PRINT) ===================== */}
          <section className="print-only-statement p-2">
            {/* Header / Letterhead */}
            <div className="flex items-start justify-between pb-4 border-b-2 border-slate-900 mb-4">
              <div>
                <h1 className="text-2xl font-black text-slate-950 uppercase tracking-tight">Order Center</h1>
                <p className="text-sm font-bold text-slate-700 mt-0.5">
                  {lang === 'ku' ? 'ڕاپۆرتی فەرمی دارایی و خەزێنە' : 'Official Treasury & Financial Statement'}
                </p>
                <p className="text-xs text-slate-500">
                  {lang === 'ku' ? 'بەرواری دەرکردن:' : 'Generated Date:'} {new Date().toLocaleString(lang === 'ku' ? 'ckb-IQ' : 'en-US')}
                </p>
              </div>
              <div className={isRtl ? 'text-left' : 'text-right'}>
                <span className="text-xs uppercase font-extrabold px-2.5 py-1 bg-slate-100 border border-slate-300 rounded text-slate-800">
                  A4 Executive Audit
                </span>
                <p className="text-xs text-slate-600 mt-2">
                  {lang === 'ku' ? 'پشکی هاوبەشەکان: سەروەر (٥٠٪) • واژام (٥٠٪)' : 'Partners: Sarwar (50%) • Wazham (50%)'}
                </p>
              </div>
            </div>

            {/* Financial Snapshot Summary Cards */}
            <div className="grid grid-cols-4 gap-3 mb-5 print-card">
              <div className="p-3 border border-slate-300 rounded-lg bg-slate-50">
                <span className="text-[10px] font-bold text-slate-500 uppercase">{t.totalLiquidity}</span>
                <div className="text-base font-black text-slate-900 mt-0.5">{formatIQD(totalConsolidatedLiquidity)}</div>
                <div className="text-[10px] text-slate-500 font-semibold">≈ {formatUSD(totalConsolidatedLiquidity)}</div>
              </div>
              <div className="p-3 border border-slate-300 rounded-lg bg-slate-50">
                <span className="text-[10px] font-bold text-slate-500 uppercase">{t.totalRevenue}</span>
                <div className="text-base font-black text-emerald-700 mt-0.5">+{formatIQD(metrics.totalRevenue)}</div>
              </div>
              <div className="p-3 border border-slate-300 rounded-lg bg-slate-50">
                <span className="text-[10px] font-bold text-slate-500 uppercase">{t.totalExpenses}</span>
                <div className="text-base font-black text-rose-700 mt-0.5">-{formatIQD(metrics.totalExpenses)}</div>
              </div>
              <div className="p-3 border border-slate-300 rounded-lg bg-slate-50">
                <span className="text-[10px] font-bold text-slate-500 uppercase">{t.netProfit}</span>
                <div className="text-base font-black text-indigo-900 mt-0.5">{formatIQD(metrics.netProfit)}</div>
              </div>
            </div>

            {/* 5 Accounts Balance Breakdown */}
            <div className="mb-5 border border-slate-300 rounded-lg p-3 print-card bg-white">
              <h4 className="text-xs font-black uppercase text-slate-700 mb-2">
                {lang === 'ku' ? 'دابەشبوونی نەختینە بەسەر ٥ هەژمارەکەدا' : '5 Account Liquidity Distribution'}
              </h4>
              <div className="grid grid-cols-5 gap-2 text-center">
                {Object.values(ACCOUNTS).map((acc) => (
                  <div key={acc.id} className="p-2 border border-slate-200 rounded bg-slate-50">
                    <span className="text-[10px] font-bold text-slate-600 block">{getAccountShortName(acc)}</span>
                    <span className="text-xs font-black text-slate-900 mt-0.5 block">{formatIQD(accountBalances[acc.id] || 0)}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Filter Scope Note */}
            <div className="mb-2 text-xs font-bold text-slate-600 flex items-center justify-between">
              <span>
                {lang === 'ku' ? 'تۆماری جووڵە داراییەکان (تۆمارە فلتەرکراوەکان):' : 'General Ledger Records (Filtered Scope):'} {filteredTransactions.length} {lang === 'ku' ? 'جووڵە' : 'records'}
              </span>
              <span>{t.exchangeRateNote} {exchangeRate} IQD</span>
            </div>

            {/* Ledger Table for Print */}
            <table className="w-full text-xs text-slate-900 border border-slate-300">
              <thead>
                <tr className="bg-slate-200 text-slate-800 text-[10px] uppercase font-black text-start">
                  <th className="p-2 border-b border-slate-400">#</th>
                  <th className="p-2 border-b border-slate-400">{t.colRefDate}</th>
                  <th className="p-2 border-b border-slate-400">{t.colType}</th>
                  <th className="p-2 border-b border-slate-400">{t.colAccountFlow}</th>
                  <th className="p-2 border-b border-slate-400">{t.colCategory}</th>
                  <th className="p-2 border-b border-slate-400">{t.colPartner}</th>
                  <th className="p-2 border-b border-slate-400">{t.colNotes}</th>
                  <th className={`p-2 border-b border-slate-400 ${isRtl ? 'text-left' : 'text-right'}`}>{t.colAmount}</th>
                </tr>
              </thead>
              <tbody>
                {filteredTransactions.map((tx, idx) => {
                  const amtIQD = toIQD(tx);
                  const fromAcc = ACCOUNTS[tx.accountId];
                  const toAcc = tx.toAccountId ? ACCOUNTS[tx.toAccountId] : null;

                  return (
                    <tr key={tx.id} className="border-b border-slate-200">
                      <td className="p-1.5 text-slate-500 font-mono text-[10px]">{idx + 1}</td>
                      <td className="p-1.5 font-mono text-[10px]">
                        <strong>{tx.refNumber || tx.id}</strong>
                        <div className="text-slate-500">{new Date(tx.date).toLocaleDateString()}</div>
                      </td>
                      <td className="p-1.5 font-bold">
                        {tx.type === 'income' ? t.typeIncome : tx.type === 'expense' ? t.typeExpense : tx.type === 'transfer' ? t.typeTransfer : t.typeWithdrawal}
                      </td>
                      <td className="p-1.5">
                        {tx.type === 'transfer' 
                          ? `${getAccountShortName(fromAcc)} ➔ ${getAccountShortName(toAcc)}`
                          : getAccountShortName(fromAcc)}
                      </td>
                      <td className="p-1.5">{tx.category}</td>
                      <td className="p-1.5 font-semibold">{getPartnerName(tx.partner)}</td>
                      <td className="p-1.5 text-slate-700 max-w-xs">{tx.notes}</td>
                      <td className={`p-1.5 font-black whitespace-nowrap ${isRtl ? 'text-left' : 'text-right'} ${
                        tx.type === 'income' ? 'text-emerald-700' : tx.type === 'expense' || tx.type === 'withdrawal' ? 'text-rose-700' : 'text-slate-800'
                      }`}>
                        {tx.type === 'income' ? '+' : tx.type === 'expense' || tx.type === 'withdrawal' ? '-' : ''}
                        {formatIQD(amtIQD)}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>

            {/* Partner Sign-off & Audit Signature Footer */}
            <div className="mt-12 pt-6 border-t-2 border-slate-400 grid grid-cols-2 gap-8 text-center print-card">
              <div>
                <p className="text-xs font-bold text-slate-600 mb-10">
                  {lang === 'ku' ? 'واژووی هاوبەش (سەروەر)' : 'Partner Signature (Sarwar)'}
                </p>
                <div className="w-48 mx-auto border-b border-dashed border-slate-400"></div>
              </div>
              <div>
                <p className="text-xs font-bold text-slate-600 mb-10">
                  {lang === 'ku' ? 'واژووی هاوبەش (واژام)' : 'Partner Signature (Wazham)'}
                </p>
                <div className="w-48 mx-auto border-b border-dashed border-slate-400"></div>
              </div>
            </div>
          </section>

          {/* Toast Notification */}
          {toastMessage && (
            <div className={`fixed bottom-6 ${isRtl ? 'left-6' : 'right-6'} z-50 flex items-center gap-3 px-4 py-3 rounded-2xl bg-zinc-900 text-white shadow-2xl border border-zinc-700 animate-bounce`}>
              <Icon name="check" className="w-4 h-4 text-emerald-400" />
              <span className="text-sm font-semibold">{toastMessage}</span>
            </div>
          )}

          {/* Confirm Dialog */}

                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-2">
                      {[
                        { id: 'income', label: t.typeIncome, icon: 'arrow-down-left', color: 'text-emerald-500' },
                        { id: 'expense', label: t.typeExpense, icon: 'arrow-up-right', color: 'text-rose-500' },
                        { id: 'transfer', label: t.typeTransfer, icon: 'arrow-left-right', color: 'text-blue-500' },
                        { id: 'withdrawal', label: t.typeWithdrawal, icon: 'user-check', color: 'text-amber-500' }
                      ].map((tItem) => {
                        const isSelected = txForm.type === tItem.id;
                        return (
                          <button
                            type="button"
                            key={tItem.id}
                            onClick={() => {
                              setCategoryManagerType(tItem.id);
                              setTxForm({ 
                                ...txForm, 
                                type: tItem.id, 
                                category: (categories[tItem.id] && categories[tItem.id][0]) || 'General' 
                              });
                            }}
                            className={`flex flex-col items-center gap-1 p-2 rounded-xl border text-xs font-bold transition ${
                              isSelected
                                ? 'bg-[#711612] text-white border-[#711612] shadow-md'
                                : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-slate-300'
                            }`}
                          >
                            <Icon name={tItem.icon} className={`w-4 h-4 ${isSelected ? 'text-white' : tItem.color}`} />
                            <span className="truncate">{tItem.label}</span>
                          </button>
                        );
                      })}

                      {/* Partner Loan Button inside Transaction Classification */}
                      <button
                        type="button"
                        onClick={() => {
                          closeTxModal();
                          openLoanModal(txForm.partner || 'Sarwar');
                        }}
                        className="flex flex-col items-center gap-1 p-2 rounded-xl border text-xs font-bold transition bg-rose-50/80 text-rose-700 border-rose-200 hover:bg-rose-600 hover:text-white group"
                        title={lang === 'ku' ? 'تۆمارکردنی قەرزی هاوبەش' : 'Record Partner Loan'}
                      >
                        <Icon name="hand-coins" className="w-4 h-4 text-rose-600 group-hover:text-white transition" />
                        <span className="truncate">{lang === 'ku' ? 'قەرزی هاوبەش' : 'Partner Loan'}</span>
                      </button>
                    </div>
                  </div>

                  {/* Amount & Currency */}
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">{t.amountCurrency}</label>
                    <div className="flex gap-2">
                      <input
                        type="number"
                        min="1"
                        required
                        placeholder="e.g. 500000"
                        value={txForm.amount}
                        onChange={(e) => setTxForm({ ...txForm, amount: e.target.value })}
                        className="w-full p-2.5 text-base font-bold bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                      />
                      <select
                        value={txForm.currency}
                        onChange={(e) => setTxForm({ ...txForm, currency: e.target.value })}
                        className="p-2.5 font-bold text-xs bg-slate-100 border border-slate-200 rounded-xl text-slate-800"
                      >
                        <option value="IQD">{lang === 'ku' ? 'دینار (د.ع)' : 'IQD'}</option>
                        <option value="USD">{lang === 'ku' ? 'دۆلار ($)' : 'USD'}</option>
                      </select>
                    </div>
                  </div>

                  {/* Accounts */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">
                        {txForm.type === 'transfer' ? t.sourceAccount : t.accountTarget}
                      </label>
                      <select
                        value={txForm.accountId}
                        onChange={(e) => setTxForm({ ...txForm, accountId: e.target.value })}
                        className="w-full p-2.5 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl"
                      >
                        {Object.values(ACCOUNTS).map((acc) => (
                          <option key={acc.id} value={acc.id}>{getAccountName(acc)}</option>
                        ))}
                      </select>
                    </div>

                    {txForm.type === 'transfer' ? (
                      <div>
                        <label className="block text-xs font-bold text-slate-600 mb-1">{t.destAccount}</label>
                        <select
                          value={txForm.toAccountId}
                          onChange={(e) => setTxForm({ ...txForm, toAccountId: e.target.value })}
                          className="w-full p-2.5 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl"
                        >
                          {Object.values(ACCOUNTS)
                            .filter(a => a.id !== txForm.accountId)
                            .map((acc) => (
                              <option key={acc.id} value={acc.id}>{getAccountName(acc)}</option>
                            ))}
                        </select>
                      </div>
                    ) : (
                      <div>
                        <label className="block text-xs font-bold text-slate-600 mb-1">{t.associatedPartner}</label>
                        <select
                          value={txForm.partner}
                          onChange={(e) => setTxForm({ ...txForm, partner: e.target.value })}
                          className="w-full p-2.5 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl"
                        >
                          {PARTNERS.map((p) => (
                            <option key={p} value={p}>{getPartnerName(p)}</option>
                          ))}
                        </select>
                      </div>
                    )}
                  </div>

                  {/* Category & Ref # */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="block text-xs font-bold text-slate-600">{t.accountingCategory}</label>
                        {isAdmin && (
                          <button
                            type="button"
                            onClick={() => {
                              setCategoryManagerType(txForm.type);
                              setNewCategoryName('');
                              setCategoryManagerError('');
                              setIsCategoryManagerOpen(true);
                            }}
                            className="text-[11px] font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1 transition px-1.5 py-0.5 rounded hover:bg-indigo-50"
                            title={lang === 'ku' ? 'زیادکردن یان سڕینەوەی جۆرەکان' : 'Add or delete categories'}
                          >
                            <Icon name="plus-circle" className="w-3.5 h-3.5" />
                            <span>{lang === 'ku' ? '+ بەڕێوەبردن' : '+ Manage'}</span>
                          </button>
                        )}
                      </div>
                      <select
                        value={txForm.category}
                        onChange={(e) => setTxForm({ ...txForm, category: e.target.value })}
                        className="w-full p-2.5 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                      >
                        {(categories[txForm.type] || []).map((cat) => (
                          <option key={cat} value={cat}>{cat}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">{t.refInvoiceNum}</label>
                      <input
                        type="text"
                        readOnly
                        tabIndex="-1"
                        value={txForm.refNumber || generateNextInvoiceNumber(transactions)}
                        className="w-full p-2.5 text-xs font-bold font-mono bg-slate-100 text-slate-700 border border-slate-200 rounded-xl cursor-not-allowed select-all focus:outline-none"
                        title={lang === 'ku' ? 'ژمارەی پسوولە خۆکارە و ناگۆڕدرێت' : 'Order invoice is automatically generated and unchangeable.'}
                      />
                    </div>
                  </div>

                  {/* Notes */}
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">{t.reasonMemo}</label>
                    <textarea
                      rows="3"
                      required
                      placeholder={t.memoPlaceholder}
                      value={txForm.notes}
                      onChange={(e) => setTxForm({ ...txForm, notes: e.target.value })}
                      className="w-full p-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl resize-none"
                    />
                  </div>

                  {/* Date */}
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">{t.dateTimeMovement}</label>
                    <input
                      type="datetime-local"
                      value={txForm.date}
                      onChange={(e) => setTxForm({ ...txForm, date: e.target.value })}
                      className="w-full p-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl"
                    />
                  </div>

                  {/* Buttons */}
                  <div className="pt-4 border-t border-slate-100 flex items-center gap-3">
                    <button
                      type="button"
                      onClick={closeTxModal}
                      className="flex-1 py-2.5 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition"
                    >
                      {t.cancel}
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-lg shadow-[#711612]/25 transition"
                    >
                      {editingTx ? t.updateEntry : t.postToLedger}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: TRANSFER */}
          {isTransferModalOpen && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm p-0 sm:p-4 overflow-y-auto">
              <div className="relative w-full max-w-md rounded-t-3xl sm:rounded-3xl bg-white border border-slate-200 shadow-2xl p-5 sm:p-6 space-y-4 max-h-[92vh] sm:max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div>
                    <h3 className="text-base font-black text-slate-900">{t.quickTransferTitle}</h3>
                    <p className="text-xs text-slate-400 mt-0.5">{t.quickTransferSub}</p>
                  </div>
                  <button onClick={() => setIsTransferModalOpen(false)} className="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 transition">
                    <Icon name="x" className="w-3.5 h-3.5" />
                  </button>
                </div>

                <form onSubmit={handleSaveTransfer} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">{t.transferAmount}</label>
                    <div className="flex gap-2">
                      <input
                        type="number"
                        min="1"
                        required
                        placeholder="e.g. 1000000"
                        value={transferForm.amount}
                        onChange={(e) => setTransferForm({ ...transferForm, amount: e.target.value })}
                        className="w-full p-2.5 text-sm font-bold bg-slate-50 border border-slate-200 rounded-xl"
                      />
                      <select
                        value={transferForm.currency}
                        onChange={(e) => setTransferForm({ ...transferForm, currency: e.target.value })}
                        className="p-2.5 text-xs font-bold bg-slate-100 border border-slate-200 rounded-xl"
                      >
                        <option value="IQD">IQD</option>
                        <option value="USD">USD</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">{t.sourceAccount}</label>
                      <select
                        value={transferForm.fromAccountId}
                        onChange={(e) => setTransferForm({ ...transferForm, fromAccountId: e.target.value })}
                        className="w-full p-2 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl"
                      >
                        {Object.values(ACCOUNTS).map(acc => (
                          <option key={acc.id} value={acc.id}>{getAccountName(acc)}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">{t.destAccount}</label>
                      <select
                        value={transferForm.toAccountId}
                        onChange={(e) => setTransferForm({ ...transferForm, toAccountId: e.target.value })}
                        className="w-full p-2 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl"
                      >
                        {Object.values(ACCOUNTS)
                          .filter(a => a.id !== transferForm.fromAccountId)
                          .map(acc => (
                            <option key={acc.id} value={acc.id}>{getAccountName(acc)}</option>
                          ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">{t.authorizingPartner}</label>
                    <select
                      value={transferForm.partner}
                      onChange={(e) => setTransferForm({ ...transferForm, partner: e.target.value })}
                      className="w-full p-2 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl"
                    >
                      {PARTNERS.map(p => (
                        <option key={p} value={p}>{getPartnerName(p)}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">{t.transferNote}</label>
                    <input
                      type="text"
                      value={transferForm.notes}
                      onChange={(e) => setTransferForm({ ...transferForm, notes: e.target.value })}
                      className="w-full p-2 text-xs bg-slate-50 border border-slate-200 rounded-xl"
                    />
                  </div>

                  <div className="pt-3 border-t border-slate-100 flex gap-2">
                    <button
                      type="button"
                      onClick={() => setIsTransferModalOpen(false)}
                      className="flex-1 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 rounded-xl transition"
                    >
                      {t.cancel}
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-md transition"
                    >
                      {t.executeTransfer}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: SETTLEMENT SIMULATOR */}
          {isSettlementModalOpen && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm p-0 sm:p-4 overflow-y-auto">
              <div className="relative w-full max-w-xl rounded-t-3xl sm:rounded-3xl bg-white border border-slate-200 shadow-2xl p-5 sm:p-6 space-y-5 max-h-[92vh] sm:max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div className="flex items-center gap-2">
                    <Icon name="calculator" className="w-5 h-5 text-purple-600" />
                    <h3 className="text-base font-black text-slate-900">{t.settlementTitle}</h3>
                  </div>
                  <button onClick={() => setIsSettlementModalOpen(false)} className="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 transition">
                    <Icon name="x" className="w-3.5 h-3.5" />
                  </button>
                </div>

                <div className="space-y-5">
                  {/* Slider */}
                  <div className="p-4 rounded-2xl bg-purple-50/60 border border-purple-200 space-y-3">
                    <div className="flex items-center justify-between text-xs font-bold text-purple-950">
                      <span>{getPartnerName('Sarwar')}: {equityRatio.Sarwar}%</span>
                      <span>{getPartnerName('Wazham')}: {equityRatio.Wazham}%</span>
                    </div>
                    <input
                      type="range"
                      min="0"
                      max="100"
                      step="5"
                      value={equityRatio.Sarwar}
                      onChange={(e) => {
                        const sarwarVal = Number(e.target.value);
                        setEquityRatio({ Sarwar: sarwarVal, Wazham: 100 - sarwarVal });
                      }}
                      className="w-full accent-purple-600 cursor-pointer"
                    />
                    <p className="text-[11px] text-purple-700">{t.settlementSub}</p>
                  </div>

                  {/* Settlement Calculation Table */}
                  <div className="border border-slate-200 rounded-2xl overflow-x-auto text-xs">
                    <table className={`w-full min-w-[460px] ${isRtl ? 'text-right' : 'text-left'}`}>
                      <thead className="bg-slate-50 font-bold text-slate-500">
                        <tr>
                          <th className="p-3">{t.colPartner}</th>
                          <th className="p-3">{t.entitledShare}</th>
                          <th className="p-3">{t.totalWithdrawn}</th>
                          <th className="p-3">Partner Loan:</th>
                          <th className={`p-3 ${isRtl ? 'text-left' : 'text-right'}`}>{t.netLiquidationOwed}</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 font-medium">
                        <tr>
                          <td className="p-3 font-bold text-slate-800">{getPartnerName('Sarwar')} ({equityRatio.Sarwar}%)</td>
                          <td className="p-3">{formatIQD(partnerSettlement.sarwarEntitled)}</td>
                          <td className="p-3 text-amber-600">-{formatIQD(partnerSettlement.sarwarWithdrawn)}</td>
                          <td className="p-3 text-rose-600 font-bold">-{formatIQD(partnerSettlement.sarwarLoan)}</td>
                          <td className={`p-3 ${isRtl ? 'text-left' : 'text-right'} font-black text-indigo-600`}>
                            {formatIQD(partnerSettlement.sarwarNetDue)}
                          </td>
                        </tr>
                        <tr>
                          <td className="p-3 font-bold text-slate-800">{getPartnerName('Wazham')} ({equityRatio.Wazham}%)</td>
                          <td className="p-3">{formatIQD(partnerSettlement.wazhamEntitled)}</td>
                          <td className="p-3 text-amber-600">-{formatIQD(partnerSettlement.wazhamWithdrawn)}</td>
                          <td className="p-3 text-rose-600 font-bold">-{formatIQD(partnerSettlement.wazhamLoan)}</td>
                          <td className={`p-3 ${isRtl ? 'text-left' : 'text-right'} font-black text-purple-600`}>
                            {formatIQD(partnerSettlement.wazhamNetDue)}
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  <div className="flex justify-end">
                    <button
                      onClick={() => setIsSettlementModalOpen(false)}
                      className="w-full sm:w-auto px-5 py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl hover:bg-slate-800 transition"
                    >
                      {t.closeSimulator}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Mobile Bottom Navigation Bar (Visible only on small mobile screens < sm) */}
          <nav className="sm:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur-xl border-t border-slate-200/90 shadow-2xl px-2 py-1.5 flex items-center justify-around pb-safe">
            <button
              onClick={() => setActiveTab('dashboard')}
              className={`flex flex-col items-center gap-0.5 px-2 py-1 rounded-lg transition ${
                activeTab === 'dashboard' ? 'text-[#711612] font-black' : 'text-slate-500 font-semibold'
              }`}
            >
              <Icon name="building-2" className="w-5 h-5" />
              <span className="text-[10px]">Overview</span>
            </button>

            <button
              onClick={() => setActiveTab('transactions')}
              className={`flex flex-col items-center gap-0.5 px-2 py-1 rounded-lg transition ${
                activeTab === 'transactions' ? 'text-[#711612] font-black' : 'text-slate-500 font-semibold'
              }`}
            >
              <Icon name="file-text" className="w-5 h-5" />
              <span className="text-[10px]">Ledger</span>
            </button>

            {/* Quick Add Floating Button (Admins only) */}
            {isAdmin && (
              <button
                onClick={() => openNewTxModal('income')}
                className="flex flex-col items-center justify-center -mt-5 w-12 h-12 rounded-full bg-gradient-to-tr from-[#711612] to-[#94201C] text-white shadow-lg shadow-[#711612]/40 active:scale-95 transition"
                title="Add Transaction"
              >
                <Icon name="plus" className="w-6 h-6 stroke-[2.5]" />
              </button>
            )}

            <button
              onClick={() => setActiveTab('partners')}
              className={`flex flex-col items-center gap-0.5 px-2 py-1 rounded-lg transition ${
                activeTab === 'partners' ? 'text-[#711612] font-black' : 'text-slate-500 font-semibold'
              }`}
            >
              <Icon name="users" className="w-5 h-5" />
              <span className="text-[10px]">Partners</span>
            </button>

            <button
              onClick={() => setActiveTab(isAdmin ? 'settings' : 'analytics')}
              className={`flex flex-col items-center gap-0.5 px-2 py-1 rounded-lg transition ${
                activeTab === (isAdmin ? 'settings' : 'analytics') ? 'text-[#711612] font-black' : 'text-slate-500 font-semibold'
              }`}
            >
              <Icon name={isAdmin ? "sliders" : "bar-chart-3"} className="w-5 h-5" />
              <span className="text-[10px]">{isAdmin ? 'Settings' : 'Analytics'}</span>
            </button>
          </nav>

          {/* Footer */}
          <footer className="mt-12 sm:mt-16 border-t border-slate-200 py-6 text-center text-xs text-slate-400">
            <p>{t.footerText}</p>
          </footer>
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
